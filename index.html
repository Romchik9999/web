<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДИНО·РЫК — огнедышащий динозавр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#120705;font-family:Rubik,sans-serif;user-select:none}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  /* ── верхняя панель ── */
  .hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 22px;z-index:10;pointer-events:none}
  h1{font-family:'Press Start 2P';font-size:clamp(16px,3.2vw,28px);color:#ffd27a;letter-spacing:2px;
     text-shadow:3px 3px 0 #6b1400,0 0 26px rgba(255,120,30,.55);animation:flick 3.7s infinite}
  h1 b{color:#ff6a1c}
  @keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.7}94%{opacity:1}96%{opacity:.85}98%{opacity:1}}
  .tag{margin-top:8px;font-size:13px;font-weight:500;color:#d8a377;letter-spacing:.14em;text-transform:uppercase}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-family:'Press Start 2P';font-size:8px;padding:9px 11px;color:#ffb45e;background:rgba(30,13,6,.82);
    border:2px solid #52281a;border-radius:6px;transition:.25s}
  .chip.on{color:#ffe08a;border-color:#ff9d3d;box-shadow:0 0 14px rgba(255,140,40,.5);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 24px rgba(255,140,40,.85)}}

  /* ── пульт ── */
  .deck{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100vw - 20px));
    z-index:20;display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:center;
    padding:16px 22px 12px;border-radius:14px;border:3px solid #5a2b16;
    background:linear-gradient(180deg,rgba(44,20,9,.95),rgba(23,10,5,.97));
    box-shadow:0 14px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,180,90,.14)}
  .label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .label-row label{font-family:'Press Start 2P';font-size:9px;color:#ff9d4d;letter-spacing:1px}
  .label-row output{font-family:'Press Start 2P';font-size:13px;color:#ffd27a;text-shadow:0 0 12px rgba(255,150,40,.6)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:grab}
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;
    background:linear-gradient(90deg,#3c1a0c,#8a2c0e 45%,#ff7a1c 75%,#ffd23e);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #52281a}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff8a1e 55%,#b53a05);border:3px solid #2f1108;
    box-shadow:0 0 16px rgba(255,122,28,.75),0 3px 0 rgba(0,0,0,.5);transition:transform .15s,box-shadow .2s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1);box-shadow:0 0 28px rgba(255,150,40,.95),0 3px 0 rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#3c1a0c,#8a2c0e 45%,#ff7a1c 75%,#ffd23e);box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #52281a}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff8a1e 55%,#b53a05);border:3px solid #2f1108;box-shadow:0 0 16px rgba(255,122,28,.75)}

  .meters{margin-top:12px;display:grid;gap:7px}
  .meter{display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:center}
  .m-label{font-family:'Press Start 2P';font-size:7px;color:#c98d63;letter-spacing:1px}
  .bar{position:relative;height:14px;background:#160a06;border:2px solid #4a2415;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffdf6b,#ff8a1e 55%,#ff2f12);box-shadow:0 0 10px rgba(255,122,28,.55)}
  .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.45) 6px 8px)}

  .deck-right{display:flex;flex-direction:column;gap:10px}
  .pbtn{font-family:'Press Start 2P';font-size:10px;padding:14px 16px;color:#ffcf87;background:#3a1a0d;
    border:3px solid #77381c;border-radius:8px;cursor:pointer;box-shadow:0 5px 0 rgba(10,4,2,.8);
    transition:transform .1s,box-shadow .1s,background .2s,border-color .2s}
  .pbtn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(10,4,2,.8),0 0 18px rgba(255,140,40,.35)}
  .pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(10,4,2,.8)}
  .pbtn.on{background:#7a2410;color:#ffe9b0;border-color:#ff9d3d;box-shadow:0 5px 0 rgba(10,4,2,.8),0 0 20px rgba(255,140,40,.55)}
  .pbtn:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}

  .hint{grid-column:1/-1;margin-top:6px;font-size:12.5px;color:#b98a68;text-align:center}
  .hint kbd{font-family:'Press Start 2P';font-size:8px;color:#ffd27a;background:#2a1208;border:2px solid #6b3319;
    border-radius:5px;padding:4px 6px;box-shadow:0 2px 0 #12060399}

  /* ── всплывающий рёв ── */
  .roar{position:fixed;z-index:30;font-family:'Press Start 2P';font-size:clamp(14px,2.6vw,26px);color:#ffe08a;
    text-shadow:3px 3px 0 #7a1600,0 0 22px rgba(255,106,0,.85);pointer-events:none;transform-origin:center;
    animation:roarAnim .95s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes roarAnim{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--rot));opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.18) rotate(var(--rot));opacity:1}
    100%{transform:translate(-50%,-150%) scale(1) rotate(var(--rot));opacity:0}}

  @media(max-width:680px){
    .deck{grid-template-columns:1fr;gap:12px}
    .deck-right{flex-direction:row}
    .pbtn{flex:1;font-size:9px;padding:12px 8px}
    .hint{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud-top">
  <div class="brand">
    <h1>ДИНО<b>·</b>РЫК</h1>
    <p class="tag">чем громче — тем жарче</p>
  </div>
  <div class="chips">
    <span id="micChip" class="chip">🎤 выкл</span>
    <span id="tempChip" class="chip">🔥 20°</span>
  </div>
</header>

<section class="deck">
  <div class="deck-left">
    <div class="label-row">
      <label for="lever">РЫЧАГ РЁВА</label>
      <output id="leverOut">0%</output>
    </div>
    <input type="range" id="lever" min="0" max="100" value="0" aria-label="Сила пламени">
    <div class="meters">
      <div class="meter"><span class="m-label">ШУМ</span><div class="bar"><i id="noiseFill"></i></div></div>
      <div class="meter"><span class="m-label">ПЛАМЯ</span><div class="bar"><i id="fireFill"></i></div></div>
    </div>
  </div>
  <div class="deck-right">
    <button id="micBtn" class="pbtn">🎤 МИКРОФОН</button>
    <button id="sndBtn" class="pbtn">🔇 ЗВУК</button>
  </div>
  <p class="hint">Крикни в микрофон — динозарычит огнём · <kbd>ПРОБЕЛ</kbd> или тап по экрану — ручной залп</p>
</section>

<script>
(()=>{
const cvs=document.getElementById('scene'),ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,groundY=0,ps=8,x0=0,y0=0,stars=[],rocks=[];

function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  groundY=H*0.80;ps=Math.max(4,H*0.0112);
  x0=(W<700?W*0.30:W*0.36)-12*ps;y0=groundY-17*ps;
  stars=[];const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.5,s:Math.random()<0.85?1:2,p:Math.random()*7});
  rocks=[];for(let i=0;i<9;i++)rocks.push({x:Math.random()*W,w:6+Math.random()*26,h:3+Math.random()*7});
}
addEventListener('resize',resize);resize();

/* ── пиксель-карты динозавра ── */
const HEAD=[
".........ss...........","........ssss..........","......GGGGGGGGGG......",
".....GGGGgGGGGGGGd....","....GGGGGwwGGGGGGGGG..","....GGGGGwkGGGGGGGGGGG",
"....GGGGGGGGGGGGGGGGGG",".....GGGGGGGGGGGGGGGGG","......GGGGGGGGGGGGGGGG",
"............t..t..t..."];
const JAW=["....t..t..t..t....","..GGGGGGGGGGGGGG..","...GGGGGGGGGGGG...",".....gggggggg....."];
const BODY=[
"...........sGGGGG.......","..........sGGGGGGG......",".........sGGGGGGGGGG....",
"........sGGGGGGGGGGGG...","......GGGGGGGGGGGGGGGG..","....GGGGGGGGGGGGGGGGGG..",
"...GGGGGGGGGGGGGGGGGG...","..GGGGGGyyyyyyGGGGGGGG..",".GGGGGGyyyyyyyyyyGGGGc..",
".GGGGGyyyyyyyyyyyGGGG...","GGGGGGyyyyyyyyyyyGGG....","GGGGGGyyyyyyyyyyGGGG....",
".GGGGGGyyyyyyyyGGGGG....","..GGGGGGGGGGGGGGGGG.....","...GGGGG.....GGGGG......",
"...GGGGG.....GGGGG......","...GGGGGGc...GGGGGGc...."];
const TAIL=["............GG","..........GGGG",".......GGGGGGG","....GGGGGGGGGG","GGGGGGGGGGGGGG",
"....GGGGGGGGGG","........GGGGGG","............GG"];
const PAL={G:'#3fa05c',g:'#2a6b41',y:'#cfe6a0',s:'#ffc14d',w:'#fff',k:'#1c1108',t:'#fff3d6',c:'#ffe9c2',d:'#1f5636'};

function drawMap(map,x,y){
  for(let r=0;r<map.length;r++){const row=map[r];
    for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;
      ctx.fillStyle=PAL[ch];ctx.fillRect(x+c*ps,y+r*ps,ps+.5,ps+.5);}}}
function drawTail(x,y){
  for(let c=0;c<14;c++){const xo=Math.sin(t*2.4+c*0.33)*((14-c)/14)*ps*0.85;
    for(let r=0;r<8;r++){const ch=TAIL[r][c];if(ch==='.')continue;
      ctx.fillStyle=PAL[ch];ctx.fillRect(x+c*ps+xo,y+r*ps,ps+.5,ps+.5);}}}

/* ── состояние ── */
const state={slider:0,mic:0,inten:0,boost:false};
let micOn=false,soundOn=false,analyser=null,micBuf=null,micStream=null;
let AC=null,master,fireGain,fireFilter,growlOsc,growlGain;
const mouth={x:0,y:0},parts=[],embers=[],sparks=[];
for(let i=0;i<26;i++)embers.push(newEmber(true));
function newEmber(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,
  vy:-(6+Math.random()*18),vx:(Math.random()-0.5)*8,s:1+Math.random()*1.8,p:Math.random()*7};}

/* ── UI ── */
const lever=document.getElementById('lever'),leverOut=document.getElementById('leverOut'),
  noiseFill=document.getElementById('noiseFill'),fireFill=document.getElementById('fireFill'),
  micChip=document.getElementById('micChip'),tempChip=document.getElementById('tempChip'),
  micBtn=document.getElementById('micBtn'),sndBtn=document.getElementById('sndBtn');
lever.addEventListener('input',()=>{state.slider=+lever.value;leverOut.textContent=lever.value+'%';});

function initAudio(){
  if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  fireFilter=AC.createBiquadFilter();fireFilter.type='bandpass';fireFilter.frequency.value=500;fireFilter.Q.value=0.8;
  fireGain=AC.createGain();fireGain.gain.value=0;
  src.connect(fireFilter);fireFilter.connect(fireGain);fireGain.connect(master);src.start();
  growlOsc=AC.createOscillator();growlOsc.type='sawtooth';growlOsc.frequency.value=50;
  const glp=AC.createBiquadFilter();glp.type='lowpass';glp.frequency.value=320;
  growlGain=AC.createGain();growlGain.gain.value=0;
  const lfo=AC.createOscillator();lfo.frequency.value=14;const lg=AC.createGain();lg.gain.value=18;
  lfo.connect(lg);lg.connect(growlOsc.frequency);lfo.start();
  growlOsc.connect(glp);glp.connect(growlGain);growlGain.connect(master);growlOsc.start();
}
sndBtn.addEventListener('click',()=>{
  try{initAudio();if(AC.state==='suspended')AC.resume();}catch(e){}
  soundOn=!soundOn;sndBtn.classList.toggle('on',soundOn);
  sndBtn.textContent=soundOn?'🔊 ЗВУК: ВКЛ':'🔇 ЗВУК: ВЫКЛ';sndBtn.blur();});
micBtn.addEventListener('click',async()=>{
  micBtn.blur();
  if(micOn){micStream&&micStream.getTracks().forEach(tr=>tr.stop());micOn=false;state.mic=0;
    micBtn.classList.remove('on');micChip.classList.remove('on');micChip.textContent='🎤 выкл';return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    try{initAudio();if(AC.state==='suspended')await AC.resume();}catch(e){}
    if(AC){const s=AC.createMediaStreamSource(micStream);analyser=AC.createAnalyser();
      analyser.fftSize=1024;micBuf=new Uint8Array(analyser.fftSize);s.connect(analyser);}
    micOn=true;micBtn.classList.add('on');micChip.classList.add('on');micChip.textContent='🎤 вкл';
  }catch(e){micChip.textContent='🎤 нет доступа';}
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state.boost=true;}});
addEventListener('keyup',e=>{if(e.code==='Space')state.boost=false;});
cvs.addEventListener('pointerdown',()=>state.boost=true);
addEventListener('pointerup',()=>state.boost=false);
addEventListener('pointercancel',()=>state.boost=false);
let mouseX=innerWidth/2;addEventListener('pointermove',e=>mouseX=e.clientX);

/* ── рёв ── */
const WORDS=['Р-Р-РАРРР!','ААААРР!','ГРРРА-А!','ПШШШ-РЁЁВ!','РЫЫЫЫК!'];
let lastRoar=-9;
function roarFX(){
  const el=document.createElement('div');el.className='roar';
  el.textContent=WORDS[(Math.random()*WORDS.length)|0];
  el.style.setProperty('--rot',(Math.random()*16-8)+'deg');
  el.style.left=Math.min(innerWidth-140,x0+30*ps)+'px';
  el.style.top=Math.max(60,y0-4*ps)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),980);
  if(AC&&soundOn){try{
    const ct=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';f.type='lowpass';f.frequency.value=850;f.Q.value=2;
    o.frequency.setValueAtTime(150,ct);o.frequency.exponentialRampToValueAtTime(36,ct+0.6);
    g.gain.setValueAtTime(0.0001,ct);g.gain.exponentialRampToValueAtTime(0.55,ct+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,ct+0.7);
    o.connect(f);f.connect(g);g.connect(master);o.start(ct);o.stop(ct+0.75);}catch(e){}}
}

/* ── фон ── */
function drawVolcano(par,dt){
  const px=-par*0.012,cx=W*0.78+px,top=H*0.46;
  ctx.fillStyle='#190a0d';ctx.beginPath();
  ctx.moveTo(-20,groundY);ctx.lineTo(W*0.12+px,H*0.6);ctx.lineTo(W*0.3+px,H*0.68);
  ctx.lineTo(W*0.45+px,groundY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1d0c10';ctx.beginPath();
  ctx.moveTo(cx-W*0.2,groundY);ctx.lineTo(cx-W*0.035,top);ctx.lineTo(cx-W*0.012,top+H*0.015);
  ctx.lineTo(cx+W*0.02,top);ctx.lineTo(cx+W*0.22,groundY);ctx.closePath();ctx.fill();
  const ph=t%9,glow=ph<1.8?Math.sin(ph/1.8*Math.PI):0,cr=cx-W*0.006;
  ctx.globalCompositeOperation='lighter';
  const rg=ctx.createRadialGradient(cr,top+4,2,cr,top+4,W*0.05*(1+glow*0.8));
  rg.addColorStop(0,`rgba(255,140,40,${0.45+glow*0.5})`);rg.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=rg;ctx.fillRect(cr-W*0.08,top-W*0.06,W*0.16,W*0.12);
  if(glow>0.2&&Math.random()<0.5)sparks.push({x:cr,y:top+4,vx:(Math.random()-0.5)*70,vy:-(50+Math.random()*120),l:0.9+Math.random()*0.6});
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
    s.vy+=70*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;
    if(s.l<=0){sparks.splice(i,1);continue;}
    ctx.fillStyle=`rgba(255,170,60,${Math.min(1,s.l)})`;ctx.fillRect(s.x,s.y,2.5,2.5);}
  ctx.globalCompositeOperation='source-over';
}
function drawDino(I){
  const bob=Math.sin(t*2.1)*ps*0.3+(I>5?(Math.random()-0.5)*I*0.02:0);
  const bx=x0+(I>30?(Math.random()-0.5)*(I-30)*0.03:0),by=y0+bob;
  const jawGap=(I/100)*ps*2.4+(I>1?ps*0.15:0);
  drawTail(bx-13*ps,by+4*ps);
  drawMap(BODY,bx,by);
  const hx=bx+5*ps,hy=by-8*ps;
  drawMap(HEAD,hx,hy);
  if(t%3.7>3.55){ctx.fillStyle=PAL.G;ctx.fillRect(hx+9*ps,hy+4*ps,2*ps+.5,2*ps+.5);}
  if(I>12){ctx.fillStyle=`rgba(255,170,60,${Math.min(1,I/70)})`;
    ctx.fillRect(hx+10*ps+ps*0.5,hy+5*ps+ps*0.4,ps*0.5,ps*0.5);}
  const jawY=by+ps+jawGap;
  if(jawGap>ps*0.3){
    ctx.fillStyle='#470c0c';ctx.fillRect(bx+13*ps,by+1.4*ps,13*ps,jawGap+ps*0.4);
    if(I>6){ctx.globalCompositeOperation='lighter';
      const mg=ctx.createRadialGradient(bx+24*ps,by+1.6*ps+jawGap*0.5,1,bx+24*ps,by+1.6*ps+jawGap*0.5,ps*4);
      mg.addColorStop(0,`rgba(255,150,40,${Math.min(0.9,I/100)})`);mg.addColorStop(1,'rgba(255,80,0,0)');
      ctx.fillStyle=mg;ctx.fillRect(bx+12*ps,by-ps,16*ps,5*ps);
      ctx.globalCompositeOperation='source-over';}}
  drawMap(JAW,bx+9*ps,jawY);
  mouth.x=bx+26*ps;mouth.y=by+1.6*ps+jawGap*0.55;
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l+=dt;
    if(p.l>=p.tl){parts.splice(i,1);continue;}
    const q=p.l/p.tl;
    if(p.k===0){p.vy+=(Math.random()-0.5)*300*dt-30*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      ctx.fillStyle=`hsla(${52-q*40},100%,${62-q*20}%,${(1-q)*0.9})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1-q*0.6),0,7);ctx.fill();
    }else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=dt*ps*1.2;
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle=`rgba(96,78,74,${(1-q)*0.22})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
      ctx.globalCompositeOperation='lighter';}}
}
function drawFire(dt,I){
  ctx.globalCompositeOperation='lighter';
  if(I>=2){
    const mx=mouth.x,my=mouth.y;
    const n=Math.pow(I,1.12)*0.055*dt*60;let cnt=n|0;if(Math.random()<n-cnt)cnt++;
    for(let i=0;i<cnt&&parts.length<900;i++)parts.push({k:0,
      x:mx+Math.random()*ps,y:my+(Math.random()-0.5)*ps*(0.6+I*0.02),
      vx:(150+Math.random()*280)*(0.45+I/110),vy:(Math.random()-0.5)*90,
      l:0,tl:0.3+Math.random()*0.42,s:ps*(0.45+Math.random()*0.75)*(0.6+I/130)});
    if(I>22&&Math.random()<I*0.012*dt*60)parts.push({k:1,
      x:mx+ps*(4+Math.random()*I*0.3),y:my+(Math.random()-0.5)*ps*2,
      vx:30+Math.random()*70,vy:-(25+Math.random()*45),l:0,tl:1+Math.random()*1.2,s:ps*(0.8+Math.random()*1.4)});
    const len=ps*(5+I*0.42);
    const g0=ctx.createRadialGradient(mx,my,1,mx,my,ps*(2.5+I*0.12));
    g0.addColorStop(0,`rgba(255,220,140,${0.35+I*0.005})`);g0.addColorStop(1,'rgba(255,120,20,0)');
    ctx.fillStyle=g0;ctx.beginPath();ctx.arc(mx,my,ps*(2.5+I*0.12),0,7);ctx.fill();
    for(let i=0;i<=16;i++){const p=i/16;
      const wob=Math.sin(t*36+p*8.7)*ps*(0.2+p*1.15)*(0.35+I/120)+p*p*ps*1.1;
      const r=Math.max(0.5,ps*(1.05+I*0.03)*(1-p*0.78)*(0.72+0.32*Math.sin(t*47+p*13)));
      ctx.fillStyle=`hsla(${52-p*44},100%,${66-p*16}%,${(1-p)*0.85})`;
      ctx.beginPath();ctx.arc(mx+p*len,my+wob,r,0,7);ctx.fill();
      if(p<0.3){ctx.fillStyle=`rgba(255,255,230,${(0.3-p)*2.2*Math.min(1,I/40)})`;
        ctx.beginPath();ctx.arc(mx+p*len,my+wob,r*0.55,0,7);ctx.fill();}}
    const gl=ctx.createRadialGradient(mx+len*0.5,groundY,4,mx+len*0.5,groundY,len*0.7);
    gl.addColorStop(0,`rgba(255,110,30,${I*0.0035})`);gl.addColorStop(1,'rgba(255,110,30,0)');
    ctx.fillStyle=gl;ctx.fillRect(mx-40,groundY-60,len+120,90);
  }
  updateParts(dt);
  ctx.globalCompositeOperation='source-over';
}

/* ── главный цикл ── */
let t=0,last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  let micTarget=0;
  if(micOn&&analyser){analyser.getByteTimeDomainData(micBuf);let s=0;
    for(let i=0;i<micBuf.length;i+=4){const v=(micBuf[i]-128)/128;s+=v*v;}
    const rms=Math.sqrt(s/(micBuf.length/4));micTarget=Math.min(1,Math.max(0,rms*4.6-0.05));}
  state.mic+=(micTarget-state.mic)*(micTarget>state.mic?Math.min(1,dt*22):Math.min(1,dt*6));
  const target=Math.min(100,Math.max(state.slider,state.mic*100,state.boost?100:0));
  const k=target>state.inten?1-Math.pow(0.001,dt):1-Math.pow(0.3,dt);
  state.inten+=(target-state.inten)*k;
  const I=state.inten;
  if(I>72&&t-lastRoar>1.4){lastRoar=t;roarFX();}
  if(AC){const ct=AC.currentTime,on=soundOn?1:0;
    fireGain.gain.setTargetAtTime(on*Math.pow(I/100,1.5)*0.55,ct,0.08);
    fireFilter.frequency.setTargetAtTime(300+I*11,ct,0.1);
    growlGain.gain.setTargetAtTime(on*Math.pow(I/100,1.3)*0.4,ct,0.09);
    growlOsc.frequency.setTargetAtTime(42+I*0.6,ct,0.1);}
  noiseFill.style.width=(state.mic*100).toFixed(1)+'%';
  fireFill.style.width=I.toFixed(1)+'%';
  tempChip.textContent='🔥 '+Math.round(20+I*11.8)+'°';

  /* кадр */
  let shx=0,shy=0;
  if(I>70){const a=(I-70)/30*4;shx=(Math.random()-0.5)*a*2;shy=(Math.random()-0.5)*a*2;}
  ctx.save();ctx.translate(shx,shy);
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#170511');sky.addColorStop(0.45,'#3a0e0d');
  sky.addColorStop(0.8,'#7c2410');sky.addColorStop(1,'#b0480f');
  ctx.fillStyle=sky;ctx.fillRect(-8,-8,W+16,groundY+8);
  const par=mouseX-W/2;
  for(const s of stars){ctx.globalAlpha=(0.25+0.6*(0.5+0.5*Math.sin(t*1.7+s.p)))*(1-s.y/(H*0.6));
    ctx.fillStyle='#ffd9a0';ctx.fillRect(s.x-par*0.006,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  drawVolcano(par,dt);
  const hg=ctx.createRadialGradient(W*0.6,groundY,10,W*0.6,groundY,W*0.75);
  hg.addColorStop(0,`rgba(255,90,26,${0.16+I*0.0038})`);hg.addColorStop(1,'rgba(255,90,26,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,groundY);
  const gg=ctx.createLinearGradient(0,groundY,0,H);
  gg.addColorStop(0,'#301409');gg.addColorStop(0.12,'#22100b');gg.addColorStop(1,'#120705');
  ctx.fillStyle=gg;ctx.fillRect(-8,groundY,W+16,H-groundY+8);
  ctx.fillStyle='#6b2c12';ctx.fillRect(0,groundY,W,2);
  ctx.fillStyle='#0e0503';for(const r of rocks)ctx.fillRect(r.x,groundY-r.h+2,r.w,r.h);
  for(const e of embers){e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.y<-10||e.x<-10||e.x>W+10)Object.assign(e,newEmber(false));
    ctx.globalAlpha=0.35+0.5*(0.5+0.5*Math.sin(t*3+e.p));
    ctx.fillStyle='#ff9a3d';ctx.fillRect(e.x,e.y,e.s,e.s);}
  ctx.globalAlpha=1;
  drawDino(I);
  drawFire(dt,I);
  ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.5,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(5,2,1,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
