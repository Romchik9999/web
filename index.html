<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЗЛАТОХРАП 3D — дракон на золоте</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#120a08;font-family:Nunito,sans-serif;user-select:none}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  .hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 22px;z-index:10;pointer-events:none}
  h1{font-family:Unbounded;font-weight:900;font-size:clamp(18px,3.4vw,32px);color:#ffd873;letter-spacing:.04em;
     text-shadow:0 2px 0 #5c3a00,0 5px 18px rgba(255,170,40,.35)}
  h1 b{color:#ff9d3d}
  .tag{margin-top:6px;font-size:13px;font-weight:600;color:#c9a06a;letter-spacing:.06em}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-family:Unbounded;font-weight:700;font-size:10px;padding:9px 12px;border-radius:8px;
    color:#e8c98a;background:rgba(26,15,7,.85);border:2px solid #5c4018;transition:.25s;white-space:nowrap}
  .chip.sleep{color:#bfe8d8;border-color:#2e5c50}
  .chip.warn{color:#ffd873;border-color:#8a6a20}
  .chip.rage{color:#ffb15e;border-color:#ff7a2e;box-shadow:0 0 16px rgba(255,110,30,.6);animation:pulse 1s infinite}
  .chip.on{color:#ffe08a;border-color:#ff9d3d;box-shadow:0 0 14px rgba(255,140,40,.5)}
  @keyframes pulse{50%{box-shadow:0 0 26px rgba(255,110,30,.9)}}

  .deck{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100vw - 20px));
    z-index:20;display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:center;
    padding:16px 22px 12px;border-radius:16px;border:2px solid #7a5a20;
    background:linear-gradient(180deg,rgba(38,23,10,.95),rgba(20,11,5,.97));
    box-shadow:0 16px 44px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,210,120,.18)}
  .label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .label-row label{font-family:Unbounded;font-weight:700;font-size:10px;color:#e8b45e;letter-spacing:.1em}
  .label-row output{font-family:Unbounded;font-weight:900;font-size:14px;color:#ffd873;text-shadow:0 0 12px rgba(255,170,40,.5)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:grab}
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;
    background:linear-gradient(90deg,#2c1a08,#7a4a10 40%,#ffb63e 75%,#ff6a1c);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #5c4018}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93e 55%,#a86e12);border:3px solid #3c2606;
    box-shadow:0 0 16px rgba(255,190,60,.7),0 3px 0 rgba(0,0,0,.5);transition:transform .15s,box-shadow .2s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1);box-shadow:0 0 28px rgba(255,200,80,.95)}
  input[type=range]::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#2c1a08,#7a4a10 40%,#ffb63e 75%,#ff6a1c)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93e 55%,#a86e12);border:3px solid #3c2606}

  .meters{margin-top:12px;display:grid;gap:7px}
  .meter{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}
  .m-label{font-family:Unbounded;font-weight:700;font-size:8px;color:#c99a5e;letter-spacing:.12em;white-space:nowrap}
  .m-label em{font-style:normal;color:#ffd873}
  .bar{position:relative;height:14px;background:#150c05;border:2px solid #4a3414;border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4de0c0,#ffd23e 60%,#ff9d3d)}
  .bar i.hot{background:linear-gradient(90deg,#ffd23e,#ff7a1c 60%,#ff2f12);box-shadow:0 0 12px rgba(255,90,20,.7)}
  .bar i.flame{background:linear-gradient(90deg,#ffdf6b,#ff8a1e 55%,#ff2f12)}
  .bar .th{position:absolute;top:-2px;bottom:-2px;left:59%;width:3px;background:#ffe9b0;opacity:.9;z-index:2;
    box-shadow:0 0 8px #ffd27a;transition:left .12s linear}
  .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.4) 6px 8px)}

  .deck-right{display:flex;flex-direction:column;gap:10px}
  .pbtn{font-family:Unbounded;font-weight:700;font-size:10px;padding:14px 16px;color:#ffd88a;
    background:#2c1a0a;border:2px solid #7a5a20;border-radius:10px;cursor:pointer;
    box-shadow:0 5px 0 rgba(8,4,1,.85);transition:transform .1s,box-shadow .1s,background .2s,border-color .2s;letter-spacing:.04em}
  .pbtn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(8,4,1,.85),0 0 18px rgba(255,190,60,.3)}
  .pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(8,4,1,.85)}
  .pbtn.on{background:#5c3208;color:#ffe9b0;border-color:#ffb63e;box-shadow:0 5px 0 rgba(8,4,1,.85),0 0 20px rgba(255,180,50,.5)}
  .hint{grid-column:1/-1;margin-top:6px;font-size:12.5px;font-weight:600;color:#b08a5e;text-align:center}
  .hint kbd{font-family:Unbounded;font-weight:700;font-size:8px;color:#ffd873;background:#2a1808;
    border:2px solid #6b4a1a;border-radius:6px;padding:3px 6px}

  .popup{position:fixed;z-index:30;font-family:Unbounded;font-weight:900;pointer-events:none;transform-origin:center;
    animation:pop 1s cubic-bezier(.2,.9,.3,1) forwards;font-size:clamp(15px,2.8vw,28px);color:#ffe08a;
    text-shadow:0 3px 0 #6b3a00,0 0 24px rgba(255,160,40,.7)}
  .popup.angry{color:#ff9d5e;text-shadow:0 3px 0 #5c0f00,0 0 24px rgba(255,80,20,.8)}
  .popup.quiet{color:#bfe8d8;font-weight:700;font-size:clamp(11px,1.8vw,16px);text-shadow:0 2px 0 #10352c}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--rot));opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--rot));opacity:1}
    100%{transform:translate(-50%,-160%) scale(1) rotate(var(--rot));opacity:0}}
  .zzz{position:fixed;z-index:9;font-family:Unbounded;font-weight:700;color:#cfe8ff;pointer-events:none;
    text-shadow:0 0 10px rgba(140,190,255,.7);animation:zfloat 2.8s linear forwards}
  @keyframes zfloat{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(8deg)}
    15%{opacity:.9}100%{opacity:0;transform:translate(-30%,-160%) scale(1.5) rotate(-10deg)}}
  @media(max-width:680px){.deck{grid-template-columns:1fr;gap:12px}.deck-right{flex-direction:row}
    .pbtn{flex:1;font-size:9px;padding:12px 8px}.hint{font-size:11px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud-top">
  <div class="brand">
    <h1>ЗЛАТО<b>ХРАП</b> 3D</h1>
    <p class="tag">спит на золоте · звук выше порога — проснётся и обуглит</p>
  </div>
  <div class="chips">
    <span id="stateChip" class="chip sleep">😴 СПИТ</span>
    <span id="micChip" class="chip">🎤 выкл</span>
  </div>
</header>

<section class="deck">
  <div class="deck-left">
    <div class="label-row">
      <label for="lever">РЫЧАГ РЁВА · ПОРОГ, дБ</label>
      <output id="leverOut">65 дБ</output>
    </div>
    <input type="range" id="lever" min="30" max="100" value="65" aria-label="Порог пробуждения в децибелах">
    <div class="meters">
      <div class="meter"><span class="m-label">ШУМ <em id="noiseVal">0</em> дБ</span>
        <div class="bar"><span class="th" id="thMark"></span><i id="noiseFill"></i></div></div>
      <div class="meter"><span class="m-label">ПЛАМЯ</span>
        <div class="bar"><i id="fireFill" class="flame"></i></div></div>
    </div>
  </div>
  <div class="deck-right">
    <button id="micBtn" class="pbtn">🎤 МИКРОФОН</button>
    <button id="sndBtn" class="pbtn">🔊 ЗВУК</button>
  </div>
  <p class="hint">шум громче порога будит дракона → рёв + огонь · <kbd>ПРОБЕЛ</kbd>/тап — принудительный залп</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const lever=$('lever'),leverOut=$('leverOut'),noiseFill=$('noiseFill'),fireFill=$('fireFill'),
 micChip=$('micChip'),stateChip=$('stateChip'),micBtn=$('micBtn'),sndBtn=$('sndBtn'),
 thMark=$('thMark'),noiseVal=$('noiseVal');
const DB_MAX=110;
const clamp=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,u)=>a+(b-a)*u,smooth=x=>x*x*(3-2*x),rnd=(a,b)=>a+Math.random()*(b-a);
const state={thr:65,micDb:0,inten:0,boost:false,wake:0,wing:0,jaw:0,wakeHold:-1,breath:0};
let shake=0,prevHalf=false,t=0;

/* ── рычаг порога ── */
function setThr(v){state.thr=+v;leverOut.textContent=v+' дБ';thMark.style.left=(v/DB_MAX*100)+'%';}
lever.addEventListener('input',()=>setThr(lever.value));setThr(lever.value);

/* ── звук ── */
let AC=null,master,fireGain,fireFilter,growlOsc,growlGain,snGain,micOn=false,soundOn=true,analyser=null,micBuf=null,micStream=null;
function initAudio(){
 if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
 const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 fireFilter=AC.createBiquadFilter();fireFilter.type='bandpass';fireFilter.frequency.value=500;fireFilter.Q.value=.8;
 fireGain=AC.createGain();fireGain.gain.value=0;
 src.connect(fireFilter);fireFilter.connect(fireGain);fireGain.connect(master);src.start();
 growlOsc=AC.createOscillator();growlOsc.type='sawtooth';growlOsc.frequency.value=50;
 const glp=AC.createBiquadFilter();glp.type='lowpass';glp.frequency.value=320;
 growlGain=AC.createGain();growlGain.gain.value=0;
 const lfo=AC.createOscillator();lfo.frequency.value=14;const lg=AC.createGain();lg.gain.value=18;
 lfo.connect(lg);lg.connect(growlOsc.frequency);lfo.start();
 growlOsc.connect(glp);glp.connect(growlGain);growlGain.connect(master);growlOsc.start();
 const snOsc=AC.createOscillator();snOsc.type='triangle';snOsc.frequency.value=52;
 const snF=AC.createBiquadFilter();snF.type='lowpass';snF.frequency.value=160;
 snGain=AC.createGain();snGain.gain.value=0;
 snOsc.connect(snF);snF.connect(snGain);snGain.connect(master);snOsc.start();}
function roarSound(){if(!AC||!soundOn)return;try{
 const ct=AC.currentTime,o=AC.createOscillator(),g2=AC.createGain(),f=AC.createBiquadFilter();
 o.type='sawtooth';f.type='lowpass';f.frequency.value=850;f.Q.value=2;
 o.frequency.setValueAtTime(150,ct);o.frequency.exponentialRampToValueAtTime(36,ct+0.6);
 g2.gain.setValueAtTime(0.0001,ct);g2.gain.exponentialRampToValueAtTime(0.55,ct+0.05);
 g2.gain.exponentialRampToValueAtTime(0.0001,ct+0.7);
 o.connect(f);f.connect(g2);g2.connect(master);o.start(ct);o.stop(ct+0.75);}catch(e){}}
sndBtn.addEventListener('click',()=>{try{initAudio();AC.resume();}catch(e){}
 soundOn=!soundOn;sndBtn.classList.toggle('on',soundOn);
 sndBtn.textContent=soundOn?'🔊 ЗВУК: ВКЛ':'🔇 ЗВУК: ВЫКЛ';sndBtn.blur();});
sndBtn.classList.add('on');
micBtn.addEventListener('click',async()=>{micBtn.blur();
 if(micOn){micStream&&micStream.getTracks().forEach(tr=>tr.stop());micOn=false;state.micDb=0;
  micBtn.classList.remove('on');micChip.classList.remove('on');micChip.textContent='🎤 выкл';return;}
 try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  try{initAudio();AC.resume();}catch(e){}
  if(AC){const s=AC.createMediaStreamSource(micStream);analyser=AC.createAnalyser();
   analyser.fftSize=1024;micBuf=new Uint8Array(analyser.fftSize);s.connect(analyser);}
  micOn=true;micBtn.classList.add('on');micChip.classList.add('on');micChip.textContent='🎤 слушаю';
 }catch(e){micChip.textContent='🎤 нет доступа';}});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state.boost=true;state.wakeHold=t+1.2;
 try{initAudio();AC.resume();}catch(err){}}});
addEventListener('keyup',e=>{if(e.code==='Space')state.boost=false;});
addEventListener('pointerup',()=>state.boost=false);
addEventListener('pointerdown',()=>{state.boost=true;state.wakeHold=t+1.2;
 try{initAudio();AC.resume();}catch(e){}});

/* ── всплывашки и Zzz ── */
const WAKEW=['КТО ПОСМЕЛ?!','Р-Р-РАРРР!','ААААРХ!','МОЁ ЗОЛОТО!'];
const pick=a=>a[(Math.random()*a.length)|0];
function popup(text,x,y,cls){const el=document.createElement('div');el.className='popup '+(cls||'');
 el.textContent=text;el.style.setProperty('--rot',rnd(-8,8)+'deg');
 el.style.left=Math.max(90,Math.min(innerWidth-90,x))+'px';el.style.top=Math.max(64,y)+'px';
 document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}
function spawnZzz(x,y){const el=document.createElement('div');el.className='zzz';el.textContent='Z';
 el.style.fontSize=rnd(14,26)+'px';el.style.left=x+'px';el.style.top=y+'px';
 document.body.appendChild(el);setTimeout(()=>el.remove(),2800);}

/* ═══ THREE.JS СЦЕНА ═══ */
let W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({canvas:$('scene'),antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.setSize(W,H);renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x120a08);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x120a08,9,24);
const camera=new THREE.PerspectiveCamera(45,W/H,0.1,60);
camera.position.set(0,2.6,8.4);

/* свет */
scene.add(new THREE.HemisphereLight(0x3a2a4f,0x2a1608,0.55));
const moon=new THREE.DirectionalLight(0x9fd8ff,0.5);
moon.position.set(-4,7,4);moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-6;moon.shadow.camera.right=6;moon.shadow.camera.top=6;moon.shadow.camera.bottom=-6;
scene.add(moon);
const goldLight=new THREE.PointLight(0xffaa33,1.1,12,2);goldLight.position.set(0,1.8,1.6);scene.add(goldLight);
const fireLight=new THREE.PointLight(0xff6a1c,0,9,2);scene.add(fireLight);

/* материалы */
const M={
 orange:new THREE.MeshStandardMaterial({color:0xf5822e,roughness:0.55}),
 cream:new THREE.MeshStandardMaterial({color:0xf7ddb0,roughness:0.6}),
 horn:new THREE.MeshStandardMaterial({color:0x7d2b26,roughness:0.5}),
 claw:new THREE.MeshStandardMaterial({color:0xb7b1d1,roughness:0.4}),
 wing:new THREE.MeshStandardMaterial({color:0xff5f9e,roughness:0.6,side:THREE.DoubleSide}),
 gold:new THREE.MeshStandardMaterial({color:0xffc93e,metalness:0.85,roughness:0.3}),
 pile:new THREE.MeshStandardMaterial({color:0xb07c1e,metalness:0.6,roughness:0.5}),
 rock:new THREE.MeshStandardMaterial({color:0x2a1a14,roughness:1,flatShading:true}),
 ground:new THREE.MeshStandardMaterial({color:0x241511,roughness:1}),
 mouth:new THREE.MeshStandardMaterial({color:0x5c1010,roughness:0.8})};

/* пещера и пол */
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,32),M.ground);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<7;i++){
 const r=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(1.5,3.4),0),M.rock);
 const a=rnd(0,Math.PI*2),d=rnd(6,10);
 r.position.set(Math.sin(a)*d,rnd(0.4,1.4),-Math.abs(Math.cos(a))*d+2);
 r.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));scene.add(r);}

/* куча золота + монеты */
const pile=new THREE.Mesh(new THREE.SphereGeometry(2.7,28,18),M.pile);
pile.scale.set(1,0.5,1);pile.position.y=0.05;pile.castShadow=true;pile.receiveShadow=true;scene.add(pile);
{
 const coinGeo=new THREE.CylinderGeometry(0.14,0.14,0.04,10);
 const N=260,inst=new THREE.InstancedMesh(coinGeo,M.gold,N);
 const d=new THREE.Object3D();let i=0;
 while(i<N){
  if(i<N-30){
   const x=rnd(-2.4,2.4),z=rnd(-2.4,2.4),r2=x*x+z*z;
   if(r2>2.5*2.5)continue;
   const y=0.5*Math.sqrt(Math.max(0.2,2.7*2.7-r2))+rnd(-0.05,0.1);
   if(y<0.2)continue;
   d.position.set(x,y,z);
   d.rotation.set(rnd(-0.5,0.5),rnd(0,3),rnd(-0.5,0.5));
  }else{
   const a=rnd(0,Math.PI*2),dd=rnd(2.7,3.6);
   d.position.set(Math.sin(a)*dd,0.03,Math.cos(a)*dd);
   d.rotation.set(0,rnd(0,3),0);}
  d.updateMatrix();inst.setMatrixAt(i++,d.matrix);}
 inst.instanceMatrix.needsUpdate=true;inst.castShadow=true;scene.add(inst);
 [[-1.6,1.0,0.9,0x4de0c0],[1.8,0.8,1.2,0xff6a8a],[0.4,1.35,-0.6,0x7ab8ff]].forEach(([x,y,z,c])=>{
  const gem=new THREE.Mesh(new THREE.IcosahedronGeometry(0.17,0),
   new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.5,roughness:0.2}));
  gem.position.set(x,y,z);scene.add(gem);});
}

/* ═══ ДРАКОН ═══ */
const dragon=new THREE.Group();dragon.position.y=1.28;dragon.rotation.y=-0.45;scene.add(dragon);
function mesh(geo,mat,x,y,z,parent,sx,sy,sz){
 const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
 if(sx)m.scale.set(sx,sy||sx,sz||sx);
 m.castShadow=true;(parent||dragon).add(m);return m;}
const S=new THREE.SphereGeometry(1,20,16);

/* тело */
const body=mesh(S,M.orange,0,0,0,null,1.06,0.81,0.77);
mesh(S,M.cream,0.12,-0.28,0,null,0.85,0.6,0.66);
/* ноги */
[[0.62,-0.62,0.5],[-0.78,-0.6,0.56]].forEach(p=>{[1,-1].forEach(s=>{
 mesh(S,M.orange,p[0],p[1],s*p[2],null,0.26,0.24,0.24);
 mesh(S,M.orange,p[0]+0.28,p[1]-0.12,s*p[2],null,0.2,0.16,0.22);
 for(let c=0;c<3;c++){
  const cl=mesh(new THREE.ConeGeometry(0.05,0.18,8),M.claw,p[0]+0.5,p[1]-0.16,s*p[2]+(c-1)*0.09);
  cl.rotation.z=-Math.PI/2;}});});
/* хвост */
const tailGroup=new THREE.Group();dragon.add(tailGroup);
for(let i=0;i<12;i++){
 const u=i/11;
 mesh(S,M.orange,-0.95-i*0.17,-0.05-Math.sin(u*2.2)*0.25-i*0.015,Math.sin(i*0.5)*0.3*u,tailGroup,
  0.3*(1-u*0.8)+0.05,0.28*(1-u*0.8)+0.05,0.28*(1-u*0.8)+0.05);
 if(i%3===1&&i<8){const sp=mesh(new THREE.ConeGeometry(0.07,0.26,8),M.horn,
  -0.95-i*0.17,0.22-Math.sin(u*2.2)*0.25-i*0.015,Math.sin(i*0.5)*0.3*u,tailGroup);
  sp.rotation.z=Math.PI;}}
/* шипы на спине */
for(let i=0;i<7;i++){
 const x=0.85-i*0.3,y=0.62*Math.sqrt(Math.max(0.08,1-(x/1.15)*(x/1.15)))+0.1;
 const sp=mesh(new THREE.ConeGeometry(0.09,0.36,8),M.horn,x,y,0);
 sp.rotation.z=-0.25;}
/* крылья */
function wingShape(){const s=new THREE.Shape();
 s.moveTo(0,0);s.quadraticCurveTo(0.35,0.55,0.55,0.95);s.quadraticCurveTo(1.1,1.25,1.7,1.15);
 s.quadraticCurveTo(1.25,0.75,1.15,0.55);s.quadraticCurveTo(1.7,0.45,1.95,0.1);
 s.quadraticCurveTo(1.3,0.05,1.1,-0.05);s.quadraticCurveTo(1.45,-0.35,1.5,-0.75);
 s.quadraticCurveTo(0.8,-0.45,0.25,-0.3);s.closePath();return s;}
const wingGeo=new THREE.ShapeGeometry(wingShape());
function makeWing(side){ /* side=1 лево, -1 право */
 const g=new THREE.Group();g.position.set(-0.15,0.5,side*0.5);
 const m=new THREE.Mesh(wingGeo,M.wing);m.rotation.y=-side*Math.PI/2;m.castShadow=true;
 g.add(m);dragon.add(g);return g;}
const wingL=makeWing(1),wingR=makeWing(-1);
/* голова */
const headGroup=new THREE.Group();headGroup.position.set(1.05,0.1,0);dragon.add(headGroup);
mesh(S,M.orange,0,0,0,headGroup,0.55,0.5,0.5);
mesh(S,M.orange,0.5,-0.08,0,headGroup,0.44,0.27,0.34);
mesh(S,M.cream,0.52,-0.16,0,headGroup,0.4,0.16,0.28);
mesh(S,M.horn,-0.78,0.02,0.12,headGroup,0.03,0.03,0.03);
mesh(S,M.horn,-0.78,0.02,-0.12,headGroup,0.03,0.03,0.03);
[[-0.05,0.45,0.26,0.5],[-0.05,0.45,-0.26,0.5],[0.25,0.5,0,0.35]].forEach(h=>{
 const hr=mesh(new THREE.ConeGeometry(0.09,h[3],10),M.horn,h[0],h[1],h[2],headGroup);
 hr.rotation.z=h[2]>0?-0.5:(h[2]<0?0.5:0);hr.rotation.x=h[2]*0.6;});
/* глаза: закрытые / открытые */
const closedEyes=[],openEyes=[];
[1,-1].forEach(s=>{
 const c=new THREE.Mesh(new THREE.TorusGeometry(0.11,0.022,8,16,Math.PI),
  new THREE.MeshStandardMaterial({color:0x5c2a1a}));
 c.position.set(0.34,0.1,s*0.47);c.rotation.y=s*Math.PI/2;c.rotation.z=0;
 headGroup.add(c);closedEyes.push(c);
 const og=new THREE.Group();og.position.set(0.34,0.1,s*0.45);
 const wb=new THREE.Mesh(S,new THREE.MeshStandardMaterial({color:0xffcf3e,emissive:0x994400,emissiveIntensity:0.6}));
 wb.scale.setScalar(0.12);
 const pu=new THREE.Mesh(S,new THREE.MeshStandardMaterial({color:0x150b02}));
 pu.scale.set(0.05,0.09,0.05);pu.position.set(0.06,0,s*0.09);
 og.add(wb);og.add(pu);og.visible=false;headGroup.add(og);openEyes.push(og);});
/* пасть */
const mouthIn=mesh(S,M.mouth,0.5,-0.28,0,headGroup,0.3,0.22,0.26);
const jawGroup=new THREE.Group();jawGroup.position.set(0.15,-0.28,0);headGroup.add(jawGroup);
mesh(S,M.orange,0.28,-0.06,0,jawGroup,0.4,0.14,0.3);
const mouthAnchor=new THREE.Object3D();mouthAnchor.position.set(0.85,-0.15,0);headGroup.add(mouthAnchor);

/* ═══ ОГОНЬ ═══ */
const softTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;
 const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,2,32,32,30);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const PMAX=600;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3),pCol=new Float32Array(PMAX*3);
pPos.fill(-999);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.4,map:softTex,vertexColors:true,
 blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
scene.add(points);
const pVel=new Float32Array(PMAX*3),pLife=new Float32Array(PMAX),pMax=new Float32Array(PMAX);
let pCur=0;
const flameMat=new THREE.MeshBasicMaterial({color:0xff8a1e,transparent:true,opacity:0.8,
 blending:THREE.AdditiveBlending,depthWrite:false});
const flameGeo=new THREE.ConeGeometry(0.32,1,12,1,true);flameGeo.translate(0,0.5,0);
const flame=new THREE.Mesh(flameGeo,flameMat);flame.visible=false;scene.add(flame);
const flame2=new THREE.Mesh(flameGeo,new THREE.MeshBasicMaterial({color:0xfff0b0,transparent:true,
 opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
flame2.visible=false;scene.add(flame2);

/* ── логика и цикл ── */
const headWorld=new THREE.Vector3(),fireDir=new THREE.Vector3(),q=new THREE.Quaternion(),UP=new THREE.Vector3(0,1,0);
let last=performance.now(),zzzAt=0;
function update(dt){
 let micDbT=0;
 if(micOn&&analyser){analyser.getByteTimeDomainData(micBuf);let s=0;
  for(let i=0;i<micBuf.length;i+=4){const v=(micBuf[i]-128)/128;s+=v*v;}
  const rms=Math.sqrt(s/(micBuf.length/4));
  micDbT=Math.max(0,Math.min(DB_MAX,100+20*Math.log10(Math.max(rms,0.0001))));}
 state.micDb+=(micDbT-state.micDb)*(micDbT>state.micDb?Math.min(1,dt*22):Math.min(1,dt*5));
 const thr=state.thr,noiseFire=clamp((state.micDb-thr)/35)*100;
 if(state.micDb>thr)state.wakeHold=Math.max(state.wakeHold,t+1.5);
 const awakeTarget=(state.micDb>thr||state.boost||state.wakeHold>t)?1:0;
 state.wake+=(awakeTarget-state.wake)*Math.min(1,(awakeTarget>state.wake?3.2:0.5)*dt);
 const w=state.wake,half=w>0.5;
 if(half&&!prevHalf){shake=1;roarSound();
  const v=headGroup.getWorldPosition(headWorld.clone()).project(camera);
  popup(pick(WAKEW),(v.x*0.5+0.5)*W,(-v.y*0.5+0.5)*H-60,'');}
 if(!half&&prevHalf){const v=headGroup.getWorldPosition(headWorld.clone()).project(camera);
  popup('хррр-хррр…',(v.x*0.5+0.5)*W,(-v.y*0.5+0.5)*H-40,'quiet');}
 prevHalf=half;
 state.wing+=((w>0.4?1:0)-state.wing)*Math.min(1,(w>0.4?2.6:1.2)*dt);
 const tgt=clamp(w*Math.max(state.boost?100:0,noiseFire))/100;
 state.inten+=(tgt-state.inten)*Math.min(1,(tgt>state.inten?12:2.2)*dt);
 state.jaw+=((w>0.25?Math.max(0.12,state.inten):0)-state.jaw)*Math.min(1,dt*8);
 state.breath+=dt*(w>0.5?5.4:1.5);
 shake=Math.max(0,shake-dt*1.3);
 /* HUD */
 noiseFill.style.width=(state.micDb/DB_MAX*100).toFixed(1)+'%';
 noiseFill.className=state.micDb>thr?'hot':'';
 noiseVal.textContent=Math.round(state.micDb);
 fireFill.style.width=(state.inten*100).toFixed(1)+'%';
 if(w<0.3){stateChip.textContent='😴 СПИТ';stateChip.className='chip sleep';}
 else if(w<0.75){stateChip.textContent='👁 ПРОСЫПАЕТСЯ…';stateChip.className='chip warn';}
 else if(state.inten>0.45){stateChip.textContent='🔥 ЯРОСТЬ';stateChip.className='chip rage';}
 else{stateChip.textContent='🐲 НЕ СПИТ';stateChip.className='chip warn';}
 if(AC){const ct=AC.currentTime,on=soundOn?1:0;
  fireGain.gain.setTargetAtTime(on*w*Math.pow(state.inten,1.5)*0.55,ct,0.08);
  fireFilter.frequency.setTargetAtTime(300+state.inten*1100,ct,0.1);
  growlGain.gain.setTargetAtTime(on*w*Math.pow(state.inten,1.3)*0.4,ct,0.09);
  growlOsc.frequency.setTargetAtTime(42+state.inten*60,ct,0.1);
  snGain.gain.setTargetAtTime(on*(1-w)*0.085*Math.max(0,Math.sin(state.breath)),ct,0.12);}}

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
 update(dt);
 const w=smooth(state.wake),wo=smooth(state.wing),I=state.inten;
 /* поза дракона */
 const br=Math.sin(state.breath)*(0.03*(1-w)+0.015*w);
 body.scale.set(1.06,0.81*(1+br),0.77);
 headGroup.position.set(lerp(1.0,1.3,w),lerp(0.05,0.8,w),0);
 headGroup.rotation.z=lerp(0.32,-0.12,w)-state.jaw*0.15;
 closedEyes.forEach(e=>e.visible=w<0.5);
 openEyes.forEach(e=>{e.visible=w>=0.35;e.scale.setScalar(0.5+0.5*w);});
 jawGroup.rotation.z=-state.jaw*0.55;
 tailGroup.rotation.y=Math.sin(t*(1.2+w*2.5))*0.14;
 const flap=Math.sin(t*7)*0.3*wo;
 wingL.rotation.set(lerp(1.2,-0.3+flap,wo),lerp(0.5,0.12,wo),0);
 wingR.rotation.set(-lerp(1.2,-0.3+flap,wo),-lerp(0.5,0.12,wo),0);
 wingL.scale.setScalar(lerp(0.72,1,wo));wingR.scale.setScalar(lerp(0.72,1,wo));
 /* свет */
 goldLight.intensity=1.1+I*1.4+Math.sin(t*9)*0.08;
 /* огонь */
 headGroup.updateWorldMatrix(true,false);
 mouthAnchor.getWorldPosition(headWorld);
 headGroup.getWorldQuaternion(q);
 fireDir.set(1,-0.06,0).applyQuaternion(q).normalize();
 fireLight.position.copy(headWorld).addScaledVector(fireDir,0.6);
 fireLight.intensity=I*3;
 const showF=I>0.02;
 flame.visible=flame2.visible=showF;
 if(showF){
  const len=0.6+I*3.4,wob=0.5+I*0.9+Math.sin(t*40)*0.08;
  [flame,flame2].forEach((f,ix)=>{
   f.position.copy(headWorld);
   f.quaternion.setFromUnitVectors(UP,fireDir);
   f.scale.set(wob*(ix?0.5:1),len*(ix?0.7:1),wob*(ix?0.5:1));
   f.rotation.y=t*3;});}
 /* частицы */
 if(showF){
  let n=Math.floor(220*I*dt+Math.random());
  while(n-->0){
   const i=pCur;pCur=(pCur+1)%PMAX;
   pPos[i*3]=headWorld.x+rnd(-0.08,0.08);pPos[i*3+1]=headWorld.y+rnd(-0.08,0.08);pPos[i*3+2]=headWorld.z+rnd(-0.08,0.08);
   const sp=(2.5+rnd(0,2.5))*(0.6+I);
   pVel[i*3]=fireDir.x*sp+rnd(-0.5,0.5);pVel[i*3+1]=fireDir.y*sp+rnd(-0.5,0.5);pVel[i*3+2]=fireDir.z*sp+rnd(-0.5,0.5);
   pLife[i]=0;pMax[i]=rnd(0.35,0.8);}}
 for(let i=0;i<PMAX;i++){
  if(pLife[i]<0)continue;
  pLife[i]+=dt;
  const u=pLife[i]/pMax[i];
  if(u>=1){pLife[i]=-1;pPos[i*3+1]=-999;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;continue;}
  pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=(pVel[i*3+1]+1.2*pLife[i])*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
  const f=(1-u);
  pCol[i*3]=f;pCol[i*3+1]=f*(0.75-u*0.55);pCol[i*3+2]=f*(0.3-u*0.25);}
 pGeo.attributes.position.needsUpdate=true;
 pGeo.attributes.color.needsUpdate=true;
 /* Zzz */
 if(w<0.2&&t>zzzAt){zzzAt=t+1.4;
  const v=headGroup.getWorldPosition(new THREE.Vector3()).project(camera);
  spawnZzz((v.x*0.5+0.5)*W+30,(-v.y*0.5+0.5)*H-20);}
 /* камера */
 const sh=shake*0.12+(I>0.7?(I-0.7)*0.15:0);
 camera.position.x=Math.sin(t*0.1)*0.35+(Math.random()-0.5)*sh;
 camera.position.y=2.6+Math.sin(t*0.13)*0.15+(Math.random()-0.5)*sh;
 camera.lookAt(0.4,1.7,0);
 renderer.render(scene,camera);}
requestAnimationFrame(animate);

addEventListener('resize',()=>{W=innerWidth;H=innerHeight;
 camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
})();
</script>
</body>
</html>
