<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЗЛАТОХРАП — дракон на золоте</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d0906;font-family:Nunito,sans-serif;user-select:none}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  .hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 22px;z-index:10;pointer-events:none}
  h1{font-family:Unbounded;font-weight:900;font-size:clamp(18px,3.4vw,32px);color:#ffd873;letter-spacing:.04em;
     text-shadow:0 2px 0 #5c3a00,0 5px 18px rgba(255,170,40,.35)}
  h1 b{color:#ff9d3d}
  .tag{margin-top:6px;font-size:13px;font-weight:600;color:#c9a06a;letter-spacing:.06em}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-family:Unbounded;font-weight:700;font-size:10px;padding:9px 12px;border-radius:8px;
    color:#e8c98a;background:rgba(26,15,7,.85);border:2px solid #5c4018;transition:.25s;white-space:nowrap}
  .chip.sleep{color:#bfe8d8;border-color:#2e5c50}
  .chip.warn{color:#ffd873;border-color:#8a6a20}
  .chip.rage{color:#ffb15e;border-color:#ff7a2e;box-shadow:0 0 16px rgba(255,110,30,.6);animation:pulse 1s infinite}
  .chip.on{color:#ffe08a;border-color:#ff9d3d;box-shadow:0 0 14px rgba(255,140,40,.5)}
  @keyframes pulse{50%{box-shadow:0 0 26px rgba(255,110,30,.9)}}

  .deck{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100vw - 20px));
    z-index:20;display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:center;
    padding:16px 22px 12px;border-radius:16px;border:2px solid #7a5a20;
    background:linear-gradient(180deg,rgba(38,23,10,.95),rgba(20,11,5,.97));
    box-shadow:0 16px 44px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,210,120,.18)}
  .label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .label-row label{font-family:Unbounded;font-weight:700;font-size:10px;color:#e8b45e;letter-spacing:.1em}
  .label-row output{font-family:Unbounded;font-weight:900;font-size:14px;color:#ffd873;text-shadow:0 0 12px rgba(255,170,40,.5)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:grab}
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;
    background:linear-gradient(90deg,#2c1a08,#7a4a10 40%,#ffb63e 75%,#ff6a1c);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #5c4018}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93e 55%,#a86e12);border:3px solid #3c2606;
    box-shadow:0 0 16px rgba(255,190,60,.7),0 3px 0 rgba(0,0,0,.5);transition:transform .15s,box-shadow .2s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1);box-shadow:0 0 28px rgba(255,200,80,.95),0 3px 0 rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#2c1a08,#7a4a10 40%,#ffb63e 75%,#ff6a1c);box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #5c4018}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93e 55%,#a86e12);border:3px solid #3c2606;box-shadow:0 0 16px rgba(255,190,60,.7)}

  .meters{margin-top:12px;display:grid;gap:7px}
  .meter{display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:center}
  .m-label{font-family:Unbounded;font-weight:700;font-size:8px;color:#c99a5e;letter-spacing:.12em}
  .bar{position:relative;height:14px;background:#150c05;border:2px solid #4a3414;border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#4de0c0,#ffd23e 60%,#ff9d3d);box-shadow:0 0 10px rgba(255,190,80,.4)}
  .bar i.hot{background:linear-gradient(90deg,#ffd23e,#ff7a1c 60%,#ff2f12);box-shadow:0 0 12px rgba(255,90,20,.7)}
  .bar i.flame{background:linear-gradient(90deg,#ffdf6b,#ff8a1e 55%,#ff2f12)}
  .bar .th{position:absolute;top:-2px;bottom:-2px;left:22%;width:2px;background:#ffe9b0;opacity:.85;z-index:2;box-shadow:0 0 6px #ffd27a}
  .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.4) 6px 8px)}

  .deck-right{display:flex;flex-direction:column;gap:10px}
  .pbtn{font-family:Unbounded;font-weight:700;font-size:10px;padding:14px 16px;color:#ffd88a;
    background:#2c1a0a;border:2px solid #7a5a20;border-radius:10px;cursor:pointer;
    box-shadow:0 5px 0 rgba(8,4,1,.85);transition:transform .1s,box-shadow .1s,background .2s,border-color .2s;letter-spacing:.04em}
  .pbtn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(8,4,1,.85),0 0 18px rgba(255,190,60,.3)}
  .pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(8,4,1,.85)}
  .pbtn.on{background:#5c3208;color:#ffe9b0;border-color:#ffb63e;box-shadow:0 5px 0 rgba(8,4,1,.85),0 0 20px rgba(255,180,50,.5)}
  .pbtn:focus-visible{outline:2px solid #ffd873;outline-offset:2px}

  .hint{grid-column:1/-1;margin-top:6px;font-size:12.5px;font-weight:600;color:#b08a5e;text-align:center}
  .hint kbd{font-family:Unbounded;font-weight:700;font-size:8px;color:#ffd873;background:#2a1808;
    border:2px solid #6b4a1a;border-radius:6px;padding:3px 6px;box-shadow:0 2px 0 rgba(8,4,1,.8)}

  .popup{position:fixed;z-index:30;font-family:Unbounded;font-weight:900;pointer-events:none;
    transform-origin:center;animation:pop 1s cubic-bezier(.2,.9,.3,1) forwards;
    font-size:clamp(15px,2.8vw,28px);color:#ffe08a;text-shadow:0 3px 0 #6b3a00,0 0 24px rgba(255,160,40,.7)}
  .popup.angry{color:#ff9d5e;text-shadow:0 3px 0 #5c0f00,0 0 24px rgba(255,80,20,.8)}
  .popup.quiet{color:#bfe8d8;font-weight:700;font-size:clamp(11px,1.8vw,16px);text-shadow:0 2px 0 #10352c}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--rot));opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--rot));opacity:1}
    100%{transform:translate(-50%,-160%) scale(1) rotate(var(--rot));opacity:0}}

  @media(max-width:680px){
    .deck{grid-template-columns:1fr;gap:12px}
    .deck-right{flex-direction:row}
    .pbtn{flex:1;font-size:9px;padding:12px 8px}
    .hint{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud-top">
  <div class="brand">
    <h1>ЗЛАТО<b>ХРАП</b></h1>
    <p class="tag">спит на золоте · разбудишь — обуглит</p>
  </div>
  <div class="chips">
    <span id="coinChip" class="chip">🪙 0</span>
    <span id="stateChip" class="chip sleep">😴 СПИТ</span>
    <span id="micChip" class="chip">🎤 выкл</span>
  </div>
</header>

<section class="deck">
  <div class="deck-left">
    <div class="label-row">
      <label for="lever">РЫЧАГ РЁВА</label>
      <output id="leverOut">0%</output>
    </div>
    <input type="range" id="lever" min="0" max="100" value="0" aria-label="Сила пламени">
    <div class="meters">
      <div class="meter"><span class="m-label">ШУМ</span>
        <div class="bar"><span class="th"></span><i id="noiseFill"></i></div></div>
      <div class="meter"><span class="m-label">ПЛАМЯ</span>
        <div class="bar"><i id="fireFill" class="flame"></i></div></div>
    </div>
  </div>
  <div class="deck-right">
    <button id="micBtn" class="pbtn">🎤 МИКРОФОН</button>
    <button id="sndBtn" class="pbtn">🔇 ЗВУК</button>
  </div>
  <p class="hint">шуми, чтобы разбудить · тап по золоту — украсть монетку (рискованно!) · <kbd>ПРОБЕЛ</kbd> — залп огня</p>
</section>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('scene'),ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);
const lever=$('lever'),leverOut=$('leverOut'),noiseFill=$('noiseFill'),fireFill=$('fireFill'),
 micChip=$('micChip'),stateChip=$('stateChip'),coinChip=$('coinChip'),micBtn=$('micBtn'),sndBtn=$('sndBtn');

const clamp=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,u)=>a+(b-a)*u,
 smooth=x=>x*x*(3-2*x),rnd=(a,b)=>a+Math.random()*(b-a);

let W=0,H=0,DPR=1,t=0,last=performance.now(),stolen=0;
const LY={},mouth={x:0,y:0,ang:Math.PI},headW={x:0,y:0,r:50};
let coins=[],tris=[],sparkles=[],zzz=[],flyCoins=[],parts=[];
const spots=[];for(let i=0;i<8;i++)spots.push({a:rnd(-0.3,2.4),r:rnd(0.35,0.85),s:rnd(0.03,0.06)});

const TH=0.22;
const state={slider:0,mic:0,inten:0,boost:false,wake:0,wing:0,jaw:0,wakeHold:-1,breath:0,blink:0,blinkAt:4};
let shake=0,prevHalf=false;

/* ── спрайт монеты ── */
const coinSpr=document.createElement('canvas');coinSpr.width=coinSpr.height=64;
{const c=coinSpr.getContext('2d');
 const gr=c.createRadialGradient(26,22,4,32,32,30);
 gr.addColorStop(0,'#fff6cf');gr.addColorStop(.35,'#ffe27a');gr.addColorStop(.75,'#e8a825');gr.addColorStop(1,'#9a6412');
 c.fillStyle=gr;c.beginPath();c.arc(32,32,30,0,7);c.fill();
 c.strokeStyle='#7a4d0c';c.lineWidth=3;c.stroke();
 c.strokeStyle='rgba(255,245,200,.6)';c.lineWidth=2;c.beginPath();c.arc(32,32,21,0,7);c.stroke();}

function resize(){
 DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
 cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const g=LY;
 g.groundY=H*0.86;g.D=Math.min(W*0.52,H*0.72);
 g.cx=W*0.5;g.mw=Math.min(W*0.44,g.D*0.95);g.mh=g.D*0.34;
 g.moundTop=g.groundY-g.mh;
 g.R=g.D*0.27;g.bx=g.cx+g.mw*0.06;g.by=g.moundTop+g.R*0.38;g.hr=g.R*0.52;
 // низкополигональные скалы
 tris=[];
 const cols=8,rows=6,gw=W/cols,gh=H/rows,P=[];
 for(let r=0;r<=rows;r++){P[r]=[];
  for(let c=0;c<=cols;c++){
   const jx=(c>0&&c<cols)?rnd(-0.32,0.32)*gw:0;
   const jy=(r>0&&r<rows)?rnd(-0.32,0.32)*gh:0;
   P[r][c]={x:c*gw+jx,y:r*gh+jy};}}
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const a=P[r][c],b=P[r][c+1],d=P[r+1][c],e=P[r+1][c+1];
  const set=Math.random()<0.5?[[a,b,e],[a,e,d]]:[[a,b,d],[b,e,d]];
  for(const tr of set){
   const cx=(tr[0].x+tr[1].x+tr[2].x)/3,cy=(tr[0].y+tr[1].y+tr[2].y)/3;
   tris.push({p:tr,cx,cy,shade:rnd(0.78,1.18)});}}
 coins=[];
 const mk=(x,y,r,edge)=>coins.push({x,y,r,edge,rot:rnd(-0.4,0.4)});
 for(let i=0;i<64;i++){
  const yy=rnd(g.moundTop+g.mh*0.04,g.groundY-4);
  const halfW=g.mw*0.94*Math.sqrt(Math.max(0.05,1-Math.pow((g.groundY-yy)/g.mh,2)));
  mk(g.cx+rnd(-halfW,halfW),yy,rnd(g.R*0.055,g.R*0.1),Math.random()<0.22);}
 for(let i=0;i<8;i++){const s=Math.random()<0.5?-1:1;
  mk(g.cx+s*(g.mw+rnd(10,60)),g.groundY-rnd(2,8),rnd(g.R*0.05,g.R*0.08),Math.random()<0.4);}
 coins.sort((a,b)=>a.y-b.y);
 sparkles=[];zzz=[];flyCoins=[];parts=[];
}
addEventListener('resize',resize);resize();

/* ── звук ── */
let AC=null,master,fireGain,fireFilter,growlOsc,growlGain,snGain,micOn=false,soundOn=false,analyser=null,micBuf=null,micStream=null;
function initAudio(){
 if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
 const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 fireFilter=AC.createBiquadFilter();fireFilter.type='bandpass';fireFilter.frequency.value=500;fireFilter.Q.value=.8;
 fireGain=AC.createGain();fireGain.gain.value=0;
 src.connect(fireFilter);fireFilter.connect(fireGain);fireGain.connect(master);src.start();
 growlOsc=AC.createOscillator();growlOsc.type='sawtooth';growlOsc.frequency.value=50;
 const glp=AC.createBiquadFilter();glp.type='lowpass';glp.frequency.value=320;
 growlGain=AC.createGain();growlGain.gain.value=0;
 const lfo=AC.createOscillator();lfo.frequency.value=14;const lg=AC.createGain();lg.gain.value=18;
 lfo.connect(lg);lg.connect(growlOsc.frequency);lfo.start();
 growlOsc.connect(glp);glp.connect(growlGain);growlGain.connect(master);growlOsc.start();
 const snOsc=AC.createOscillator();snOsc.type='triangle';snOsc.frequency.value=52;
 const snF=AC.createBiquadFilter();snF.type='lowpass';snF.frequency.value=160;
 snGain=AC.createGain();snGain.gain.value=0;
 snOsc.connect(snF);snF.connect(snGain);snGain.connect(master);snOsc.start();
}
function roarSound(){if(!AC||!soundOn)return;try{
 const ct=AC.currentTime,o=AC.createOscillator(),g2=AC.createGain(),f=AC.createBiquadFilter();
 o.type='sawtooth';f.type='lowpass';f.frequency.value=850;f.Q.value=2;
 o.frequency.setValueAtTime(150,ct);o.frequency.exponentialRampToValueAtTime(36,ct+0.6);
 g2.gain.setValueAtTime(0.0001,ct);g2.gain.exponentialRampToValueAtTime(0.55,ct+0.05);
 g2.gain.exponentialRampToValueAtTime(0.0001,ct+0.7);
 o.connect(f);f.connect(g2);g2.connect(master);o.start(ct);o.stop(ct+0.75);}catch(e){}}
function clink(){if(!AC||!soundOn)return;try{const ct=AC.currentTime;
 [1568,2093].forEach((f,i)=>{const o=AC.createOscillator(),g2=AC.createGain();
 o.type='sine';o.frequency.value=f;
 g2.gain.setValueAtTime(0.12/(i+1),ct+i*0.05);
 g2.gain.exponentialRampToValueAtTime(0.0001,ct+i*0.05+0.25);
 o.connect(g2);g2.connect(master);o.start(ct+i*0.05);o.stop(ct+i*0.05+0.3);});}catch(e){}}

sndBtn.addEventListener('click',()=>{
 try{initAudio();if(AC.state==='suspended')AC.resume();}catch(e){}
 soundOn=!soundOn;sndBtn.classList.toggle('on',soundOn);
 sndBtn.textContent=soundOn?'🔊 ЗВУК: ВКЛ':'🔇 ЗВУК: ВЫКЛ';sndBtn.blur();});
micBtn.addEventListener('click',async()=>{micBtn.blur();
 if(micOn){micStream&&micStream.getTracks().forEach(tr=>tr.stop());micOn=false;state.mic=0;
  micBtn.classList.remove('on');micChip.classList.remove('on');micChip.textContent='🎤 выкл';return;}
 try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  try{initAudio();if(AC.state==='suspended')await AC.resume();}catch(e){}
  if(AC){const s=AC.createMediaStreamSource(micStream);analyser=AC.createAnalyser();
   analyser.fftSize=1024;micBuf=new Uint8Array(analyser.fftSize);s.connect(analyser);}
  micOn=true;micBtn.classList.add('on');micChip.classList.add('on');micChip.textContent='🎤 слушаю';
 }catch(e){micChip.textContent='🎤 нет доступа';}});
lever.addEventListener('input',()=>{state.slider=+lever.value;leverOut.textContent=lever.value+'%';
 state.wakeHold=Math.max(state.wakeHold,t+2.5);});

/* ── ввод ── */
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state.boost=true;state.wakeHold=t+1.2;}});
addEventListener('keyup',e=>{if(e.code==='Space')state.boost=false;});
addEventListener('pointerup',()=>state.boost=false);
addEventListener('pointercancel',()=>state.boost=false);
let mouseX=innerWidth/2;addEventListener('pointermove',e=>mouseX=e.clientX);
cvs.addEventListener('pointerdown',e=>{
 const x=e.clientX,y=e.clientY,g=LY;
 const hd=Math.hypot(x-headW.x,y-headW.y);
 const inBody=Math.pow((x-g.bx)/(g.R*1.05),2)+Math.pow((y-g.by)/(g.R*0.85),2)<1;
 const dxm=(x-g.cx)/g.mw,dym=(g.groundY-y)/g.mh;
 const inMound=dxm*dxm+dym*dym<1.15&&y>g.moundTop-24;
 if(hd<headW.r||inBody){state.wakeHold=t+3;shake=Math.max(shake,0.6);
  popup(pick(['НЕ ТРОГАЙ!','РЫЫЫ!','АЙ, КОЛЬЧУГА!']),headW.x,headW.y-headW.r,'angry');return;}
 if(inMound&&coins.length){stealCoin(x,y);return;}
 state.boost=true;state.wakeHold=t+1.2;});

/* ── события ── */
const WAKEW=['КТО ПОСМЕЛ?!','Р-Р-РАРРР!','ААААРХ!','МОЁ ЗОЛОТО!'];
const GRUMBLE=['М-м-рр…','грр…','чшш…'];
const pick=a=>a[(Math.random()*a.length)|0];
function wakeEvent(){shake=1;roarSound();
 popup(pick(stolen>=3?['ВОРИШКА!!!','ОПЯТЬ ТЫ?!']:WAKEW),headW.x,headW.y-headW.r*1.3,'');
 for(let i=0;i<10;i++)if(coins.length){const c=coins[(Math.random()*coins.length)|0];
  sparkles.push({x:c.x,y:c.y,age:0,tl:rnd(.4,.9),s:rnd(4,9)});}}
function sleepEvent(){popup('хррр-хррр…',headW.x,headW.y-headW.r,'quiet');}
function popup(text,x,y,cls){
 const el=document.createElement('div');el.className='popup '+(cls||'');
 el.textContent=text;el.style.setProperty('--rot',rnd(-8,8)+'deg');
 el.style.left=Math.max(90,Math.min(innerWidth-90,x))+'px';
 el.style.top=Math.max(64,y)+'px';
 document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}
function stealCoin(x,y){
 let best=-1,bd=1e9;
 coins.forEach((c,i)=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;best=i;}});
 if(bd>90)best=(Math.random()*coins.length)|0;
 const c=coins.splice(best,1)[0];
 flyCoins.push({x:c.x,y:c.y,age:0});
 stolen++;coinChip.textContent='🪙 '+stolen;clink();
 if(state.wake<0.5){popup(pick(GRUMBLE),headW.x,headW.y-headW.r,'quiet');
  state.wakeHold=Math.max(state.wakeHold,t+0.8+rnd(0,0.6));}
 if(stolen%3===0&&state.wake<0.5)state.wakeHold=t+3;}

/* ── логика ── */
function update(dt){
 let micTarget=0;
 if(micOn&&analyser){analyser.getByteTimeDomainData(micBuf);let s=0;
  for(let i=0;i<micBuf.length;i+=4){const v=(micBuf[i]-128)/128;s+=v*v;}
  const rms=Math.sqrt(s/(micBuf.length/4));micTarget=clamp(rms*4.6-0.04);}
 state.mic+=(micTarget-state.mic)*(micTarget>state.mic?Math.min(1,dt*22):Math.min(1,dt*6));
 const noiseFire=clamp((state.mic-0.05)/0.65)*100;
 if(state.mic>TH)state.wakeHold=Math.max(state.wakeHold,t+1.5);
 const awakeTarget=(state.mic>TH||state.slider>2||state.boost||state.wakeHold>t)?1:0;
 state.wake+=(awakeTarget-state.wake)*Math.min(1,(awakeTarget>state.wake?3.2:0.5)*dt);
 const w=state.wake,half=w>0.5;
 if(half&&!prevHalf)wakeEvent();
 if(!half&&prevHalf)sleepEvent();
 prevHalf=half;
 state.wing+=((w>0.4?1:0)-state.wing)*Math.min(1,(w>0.4?2.6:1.2)*dt);
 const tgt=clamp(w*Math.max(state.slider,state.boost?100:0,noiseFire))/100;
 state.inten+=(tgt-state.inten)*Math.min(1,(tgt>state.inten?12:2.2)*dt);
 const jt=w>0.25?Math.max(0.1,state.inten):0;
 state.jaw+=(jt-state.jaw)*Math.min(1,dt*8);
 state.breath+=dt*(w>0.5?5.4:1.5);
 if(w>0.6){if(t>state.blinkAt+0.13)state.blinkAt=t+rnd(2.2,5);
  state.blink=t<state.blinkAt?1:Math.max(0,state.blink-dt*10);}
 else state.blink=0;
 shake=Math.max(0,shake-dt*1.3);
 const I=state.inten*100;
 if(I>2){
  const n=Math.pow(I,1.12)*0.05*dt*60;let cnt=n|0;if(Math.random()<n-cnt)cnt++;
  const dx=Math.cos(mouth.ang),dy=Math.sin(mouth.ang);
  for(let i=0;i<cnt&&parts.length<850;i++){
   const sp=(150+Math.random()*280)*(0.45+I/110);
   parts.push({k:0,x:mouth.x+rnd(-4,4),y:mouth.y+rnd(-4,4),
    vx:dx*sp+rnd(-25,25),vy:dy*sp+rnd(-45,45),l:0,tl:rnd(0.3,0.7),
    s:LY.R*0.05*(0.7+Math.random())*(0.6+I/130)});}
  if(I>22&&Math.random()<I*0.012*dt*60)
   parts.push({k:1,x:mouth.x+dx*LY.R*0.5,y:mouth.y+dy*LY.R*0.3,vx:dx*60,vy:-rnd(25,60),
    l:0,tl:rnd(1,2),s:LY.R*0.1});}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l+=dt;
  if(p.l>=p.tl){parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.k===0)p.vy+=(Math.random()-0.5)*300*dt-30*dt;else p.s+=dt*LY.R*0.12;}
 if(w<0.2&&Math.random()<dt*0.8&&zzz.length<5)
  zzz.push({x:mouth.x,y:mouth.y-10,age:0,s:rnd(14,22),p:rnd(0,7)});
 for(let i=zzz.length-1;i>=0;i--){const z=zzz[i];z.age+=dt;
  z.y-=dt*24;z.x+=dt*(10+Math.sin(t*2+z.p)*6);
  if(z.age>2.8||w>0.4)zzz.splice(i,1);}
 const light=0.35+state.inten*0.6;
 if(Math.random()<dt*light*4&&coins.length){const c=coins[(Math.random()*coins.length)|0];
  sparkles.push({x:c.x,y:c.y,age:0,tl:rnd(.4,.8),s:rnd(3,7)});}
 for(let i=sparkles.length-1;i>=0;i--){const s=sparkles[i];s.age+=dt;
  if(s.age>s.tl)sparkles.splice(i,1);}
 for(let i=flyCoins.length-1;i>=0;i--){const f=flyCoins[i];f.age+=dt;
  if(f.age>0.75)flyCoins.splice(i,1);}
 noiseFill.style.width=(state.mic*100).toFixed(1)+'%';
 noiseFill.className=state.mic>TH?'hot':'';
 fireFill.style.width=(state.inten*100).toFixed(1)+'%';
 if(w<0.3){stateChip.textContent='😴 СПИТ';stateChip.className='chip sleep';}
 else if(w<0.75){stateChip.textContent='👁 ПРОСЫПАЕТСЯ…';stateChip.className='chip warn';}
 else if(state.inten>0.45){stateChip.textContent='🔥 ЯРОСТЬ';stateChip.className='chip rage';}
 else{stateChip.textContent='🐲 НЕ СПИТ';stateChip.className='chip warn';}
 if(AC){const ct=AC.currentTime,on=soundOn?1:0;
  fireGain.gain.setTargetAtTime(on*w*Math.pow(state.inten,1.5)*0.55,ct,0.08);
  fireFilter.frequency.setTargetAtTime(300+state.inten*1100,ct,0.1);
  growlGain.gain.setTargetAtTime(on*w*Math.pow(state.inten,1.3)*0.4,ct,0.09);
  growlOsc.frequency.setTargetAtTime(42+state.inten*60,ct,0.1);
  snGain.gain.setTargetAtTime(on*(1-w)*0.085*Math.max(0,Math.sin(state.breath)),ct,0.12);}
}

/* ── рисование ── */
function ellipse(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,7);ctx.fill();}
function cubic(a,b,c,d,u){const v=1-u;return{
 x:v*v*v*a.x+3*v*v*u*b.x+3*v*u*u*c.x+u*u*u*d.x,
 y:v*v*v*a.y+3*v*v*u*b.y+3*v*u*u*c.y+u*u*u*d.y};}
function rotPt(p,x,y,a){const c=Math.cos(a),s=Math.sin(a),dx=x-p.x,dy=y-p.y;
 return{x:p.x+dx*c-dy*s,y:p.y+dx*s+dy*c};}

function drawRocks(light){
 const g=LY;
 for(const tr of tris){
  const vf=Math.max(0,1-Math.abs(tr.cy/H-0.42)*1.6);
  const lum=tr.shade*(0.4+0.55*vf);
  const dx=(tr.cx-g.cx)/(W*0.52),dy=(tr.cy-g.moundTop)/(H*0.62);
  const warm=light*Math.max(0,1-dx*dx-dy*dy*1.15);
  const rr=Math.min(255,106*lum+warm*200)|0,
   gg=Math.min(255,110*lum+warm*125)|0,
   bb=Math.min(255,128*lum+warm*55)|0;
  ctx.fillStyle=`rgb(${rr},${gg},${bb})`;
  ctx.beginPath();ctx.moveTo(tr.p[0].x,tr.p[0].y);
  ctx.lineTo(tr.p[1].x,tr.p[1].y);ctx.lineTo(tr.p[2].x,tr.p[2].y);
  ctx.closePath();ctx.fill();}
 const gg2=ctx.createRadialGradient(g.cx,g.moundTop,10,g.cx,g.moundTop,Math.max(W,H)*0.6);
 gg2.addColorStop(0,`rgba(255,170,60,${0.12+0.25*light})`);gg2.addColorStop(1,'rgba(255,150,40,0)');
 ctx.fillStyle=gg2;ctx.fillRect(0,0,W,H);}

function drawMound(){
 const g=LY;
 const mg=ctx.createLinearGradient(0,g.moundTop,0,g.groundY+30);
 mg.addColorStop(0,'#c08a22');mg.addColorStop(.5,'#96661a');mg.addColorStop(1,'#4e340c');
 ctx.fillStyle=mg;ctx.beginPath();
 ctx.moveTo(g.cx-g.mw,g.groundY+4);
 ctx.bezierCurveTo(g.cx-g.mw*1.02,g.groundY-g.mh*0.75,g.cx-g.mw*0.5,g.moundTop-g.mh*0.06,g.cx,g.moundTop);
 ctx.bezierCurveTo(g.cx+g.mw*0.4,g.moundTop+g.mh*0.05,g.cx+g.mw*0.72,g.groundY-g.mh*0.5,g.cx+g.mw*0.88,g.groundY-g.mh*0.2);
 ctx.quadraticCurveTo(g.cx+g.mw,g.groundY-g.mh*0.04,g.cx+g.mw,g.groundY+4);
 ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(70,44,10,.5)';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(g.cx-g.mw*0.4,g.moundTop+g.mh*0.35);ctx.quadraticCurveTo(g.cx-g.mw*0.1,g.moundTop+g.mh*0.5,g.cx+g.mw*0.2,g.moundTop+g.mh*0.42);ctx.stroke();
 ctx.beginPath();ctx.moveTo(g.cx-g.mw*0.1,g.groundY-g.mh*0.25);ctx.quadraticCurveTo(g.cx+g.mw*0.3,g.groundY-g.mh*0.15,g.cx+g.mw*0.55,g.groundY-g.mh*0.22);ctx.stroke();}

/* ── крылья ── */
function drawWing(g,open,far){
 const R=g.R;
 const shx=g.bx+R*(far?-0.1:0.12),shy=g.by-R*(far?0.42:0.5);
 const flap=Math.sin(t*(far?6.4:7)+(far?1.3:0))*0.14*open;
 const ang=lerp(1.55,-0.12,open)+flap+(far?0.25*(1-open):0);
 const sc=lerp(0.5,1,open)*(far?0.9:1);
 ctx.save();ctx.translate(shx,shy);
 if(far)ctx.scale(-1,1);
 ctx.rotate(ang);ctx.scale(sc,sc);
 const E={x:R*0.55,y:-R*0.95},
  T1={x:R*1.7,y:-R*1.55},T2={x:R*2.1,y:-R*0.55},T3={x:R*1.75,y:R*0.45};
 const mg=ctx.createLinearGradient(0,-R*1.5,R*2,R*0.3);
 if(far){mg.addColorStop(0,'#d9548c');mg.addColorStop(1,'#a82458');}
 else{mg.addColorStop(0,'#ff6aa6');mg.addColorStop(1,'#e0307a');}
 ctx.fillStyle=mg;
 ctx.beginPath();ctx.moveTo(0,0);
 ctx.quadraticCurveTo(R*0.15,-R*0.6,E.x,E.y);
 ctx.lineTo(T1.x,T1.y);
 let m={x:(T1.x+T2.x)/2,y:(T1.y+T2.y)/2};
 ctx.quadraticCurveTo(m.x-(m.x-E.x)*0.25,m.y-(m.y-E.y)*0.25,T2.x,T2.y);
 m={x:(T2.x+T3.x)/2,y:(T2.y+T3.y)/2};
 ctx.quadraticCurveTo(m.x-(m.x-E.x)*0.25,m.y-(m.y-E.y)*0.25,T3.x,T3.y);
 ctx.quadraticCurveTo(R*0.8,-R*0.05,0,0);
 ctx.closePath();ctx.fill();
 ctx.strokeStyle=far?'#d96a20':'#f5822e';ctx.lineWidth=R*0.12;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(E.x,E.y);ctx.stroke();
 [T1,T2,T3].forEach(T=>{ctx.beginPath();ctx.moveTo(E.x,E.y);ctx.lineTo(T.x,T.y);ctx.stroke();});
 ctx.fillStyle=far?'#c9c4da':'#e8e6f0';
 const spur=(p,fx,fy)=>{const l=Math.hypot(fx,fy)||1,ux=fx/l,uy=fy/l;
  ctx.beginPath();ctx.moveTo(p.x-uy*R*0.07,p.y+ux*R*0.07);
  ctx.lineTo(p.x+ux*R*0.24,p.y+uy*R*0.24);
  ctx.lineTo(p.x+uy*R*0.07,p.y-ux*R*0.07);ctx.closePath();ctx.fill();};
 spur(E,E.x,E.y);spur(T1,T1.x-E.x,T1.y-E.y);spur(T2,T2.x-E.x,T2.y-E.y);spur(T3,T3.x-E.x,T3.y-E.y);
 ctx.restore();}

/* ── дракон ── */
function horn(hr,dx,dy,s){ctx.beginPath();
 ctx.moveTo(hr*0.15+dx,-hr*0.55+dy);
 ctx.quadraticCurveTo(hr*0.8+dx,-hr+dy,hr*1.25*s+dx,-hr*1.55*s+dy);
 ctx.quadraticCurveTo(hr*0.75+dx,-hr*0.8+dy,hr*0.45+dx,-hr*0.38+dy);
 ctx.closePath();ctx.fill();}
function spec(x,y,r,a){ctx.globalCompositeOperation='lighter';
 const g2=ctx.createRadialGradient(x,y,1,x,y,r);
 g2.addColorStop(0,`rgba(255,255,240,${a})`);g2.addColorStop(1,'rgba(255,255,240,0)');
 ctx.fillStyle=g2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.globalCompositeOperation='source-over';}

function drawTail(g,grad){
 const P0={x:g.bx+g.R*0.75,y:g.by+g.R*0.15},
  P1={x:g.bx+g.R*2.05,y:g.by+g.R*0.95},
  P2={x:g.bx+g.R*0.9,y:g.groundY-g.R*0.05},
  P3={x:g.bx-g.R*1.15+Math.sin(t*(1.2+state.wake*2))*(0.04+0.06*state.wake)*g.R,
      y:g.by+g.R*0.85+Math.sin(t*2.3)*0.04*state.wake*g.R};
 ctx.fillStyle=grad;let prev=P0;
 for(let i=0;i<=22;i++){const u=i/22,p=cubic(P0,P1,P2,P3,u),r=lerp(g.R*0.34,g.R*0.06,u);
  ellipse(p.x,p.y,r,r*0.92);prev=p;
  if(i%4===2&&u<0.6){const s=(1-u)*g.R*0.18;
   ctx.fillStyle=spineGrad;ctx.beginPath();
   ctx.moveTo(p.x-r*0.5,p.y-r*0.7);
   ctx.quadraticCurveTo(p.x+r*0.2,p.y-r-s*1.6,p.x+r+s*0.5,p.y-r-s*0.6);
   ctx.quadraticCurveTo(p.x+r*0.5,p.y-r*0.5,p.x+r*0.5,p.y-r*0.4);
   ctx.closePath();ctx.fill();ctx.fillStyle=grad;}}
 const ang=Math.atan2(P3.y-prev.y,P3.x-prev.x);
 ctx.save();ctx.translate(P3.x,P3.y);ctx.rotate(ang);
 ctx.fillStyle='#f5822e';ctx.beginPath();
 ctx.moveTo(0,-g.R*0.05);ctx.quadraticCurveTo(g.R*0.3,-g.R*0.32,g.R*0.45,-g.R*0.05);
 ctx.quadraticCurveTo(g.R*0.3,g.R*0.16,0,g.R*0.07);ctx.closePath();ctx.fill();
 ctx.restore();}

function drawNeck(g,grad,hx,hy,w){
 const S={x:g.bx-g.R*0.55,y:g.by-g.R*0.3},sag=(1-w)*g.R*0.45;
 const Hb={x:hx+g.hr*0.45,y:hy+g.hr*0.35};
 const C1={x:g.bx-g.R*1.15,y:g.by-g.R*0.85+sag};

 for(let i=0;i<=13;i++){const u=i/13,p=cubic(S,C1,C2,Hb,u),r=lerp(g.R*0.42,g.hr*0.6,u);
  ellipse(p.x,p.y,r,r*0.95);}
 ctx.strokeStyle='rgba(255,190,90,.18)';ctx.lineWidth=g.R*0.1;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(S.x-g.R*0.1,S.y+g.R*0.3);
 ctx.quadraticCurveTo(C1.x-g.R*0.1,C1.y+g.R*0.5,Hb.x,Hb.y+g.hr*0.3);ctx.stroke();}

function drawLegs(g,grad){
 const limb=(x1,y1,x2,y2,wd)=>{ctx.strokeStyle=grad;ctx.lineWidth=wd;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,(y1+y2)/2+wd*0.5,x2,y2);ctx.stroke();};

 for(let i=0;i<3;i++){const cx2=fx-g.R*0.14-i*g.R*0.09;
  ctx.beginPath();ctx.moveTo(cx2,fy-g.R*0.03);
  ctx.quadraticCurveTo(cx2-g.R*0.13,fy+g.R*0.02,cx2-g.R*0.1,fy+g.R*0.09);
  ctx.quadraticCurveTo(cx2-g.R*0.02,fy+g.R*0.08,cx2,fy+g.R*0.05);ctx.fill();}}

function drawSpines(g){
 ctx.fillStyle=spineGrad;
 for(let i=0;i<8;i++){
  const ang=Math.PI*(0.97-i*0.11);
  const px=g.bx+Math.cos(ang)*g.R*0.96,py=g.by+Math.sin(ang)*g.R*0.72;
  const s=lerp(g.R*0.3,g.R*0.14,i/7);
  const nx=Math.cos(ang),ny=Math.sin(ang)*0.8;
  ctx.beginPath();
  ctx.moveTo(px-ny*s*0.4,py+nx*s*0.4);
  ctx.quadraticCurveTo(px+nx*s*0.6+s*0.35,py+ny*s*0.6-s*0.15,px+nx*s+s*0.5,py+ny*s);
  ctx.quadraticCurveTo(px+nx*s*0.4+s*0.3,py+ny*s*0.5,px+ny*s*0.4,py-nx*s*0.4);
  ctx.closePath();ctx.fill();}}

 const eg=ctx.createRadialGradient(-hr*0.05,-hr*0.05,1,0,0,hr*0.26);

 ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(0,0,hr*0.26,hr*0.2,0,0,7);ctx.fill();

 ctx.ellipse(hr*0.02,0,hr*0.055*(1.3-clamp(w)*0.6),hr*0.17,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(-hr*0.08,-hr*0.07,hr*0.035,0,7);ctx.fill();

 ctx.lineTo(ex+hr*0.22,ey-hr*0.2+w*hr*0.1);ctx.stroke();}

function drawHead(g,hx,hy,tilt,hr,w,j){
 ctx.save();ctx.translate(hx,hy);ctx.rotate(tilt);
 headW.x=hx;headW.y=hy;headW.r=hr*1.6;
 const hg=ctx.createRadialGradient(-hr*0.3,-hr*0.2,hr*0.1,-hr*0.1,0,hr*1.7);
 hg.addColorStop(0,'#ff9a4a');hg.addColorStop(.5,'#f5822e');hg.addColorStop(1,'#c85a14');
 const jawP={x:-hr*0.2,y:hr*0.2},jawAng=j*0.55;
 ctx.fillStyle='#6b2724';horn(hr,hr*0.3,-hr*0.05,0.85);
 // нижняя челюсть
 ctx.save();ctx.translate(jawP.x,jawP.y);ctx.rotate(jawAng);ctx.translate(-jawP.x,-jawP.y);
 ctx.fillStyle='#e06a1a';ctx.beginPath();
 ctx.moveTo(-hr*0.35,hr*0.12);ctx.quadraticCurveTo(-hr*1.1,hr*0.28,-hr*1.42,hr*0.4);
 ctx.quadraticCurveTo(-hr*0.8,hr*0.62,-hr*0.28,hr*0.55);
 ctx.quadraticCurveTo(-hr*0.05,hr*0.4,-hr*0.35,hr*0.12);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f7ddb0';ellipse(-hr*1.15,hr*0.32,hr*0.4,hr*0.14);
 ctx.fillStyle='#f5ead0';
 for(let i=0;i<3;i++){const tx=-hr*(1.25-i*0.28);
  ctx.beginPath();ctx.moveTo(tx,hr*0.3);ctx.lineTo(tx+hr*0.06,hr*0.12);ctx.lineTo(tx+hr*0.12,hr*0.3);ctx.fill();}
 ctx.strokeStyle='rgba(255,190,90,.3)';ctx.lineWidth=hr*0.08;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-hr*1.3,hr*0.45);ctx.quadraticCurveTo(-hr*0.7,hr*0.6,-hr*0.3,hr*0.5);ctx.stroke();
 ctx.restore();
 if(j>0.04){
  const lp=rotPt(jawP,-hr*1.42,hr*0.4,jawAng);
  const mg=ctx.createLinearGradient(jawP.x,0,-hr*1.42,0);
  mg.addColorStop(0,'#2a0606');mg.addColorStop(1,'#5c1010');
  ctx.fillStyle=mg;ctx.beginPath();ctx.moveTo(jawP.x,jawP.y);
  ctx.lineTo(-hr*1.42,hr*0.18);ctx.lineTo(lp.x,lp.y);ctx.closePath();ctx.fill();
  if(state.inten>0.04){ctx.globalCompositeOperation='lighter';
   const fg=ctx.createRadialGradient(-hr*0.7,hr*0.25,1,-hr*0.7,hr*0.25,hr*0.9);
   fg.addColorStop(0,`rgba(255,170,50,${Math.min(0.95,state.inten*1.1)})`);
   fg.addColorStop(1,'rgba(255,80,0,0)');
   ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(jawP.x,jawP.y);
   ctx.lineTo(-hr*1.42,hr*0.18);ctx.lineTo(lp.x,lp.y);ctx.closePath();ctx.fill();
   ctx.globalCompositeOperation='source-over';}}
 // череп
 ctx.fillStyle=hg;
 ellipse(0,0,hr*0.95,hr*0.82);
 ellipse(-hr*0.85,hr*0.05,hr*0.72,hr*0.42);
 ellipse(-hr*0.5,-hr*0.35,hr*0.55,hr*0.4);
 // гребешок из рожек
 ctx.fillStyle='#7d2b26';
 [[-hr*0.15,-hr*0.7,0.9],[hr*0.12,-hr*0.78,1],[hr*0.38,-hr*0.68,0.8]].forEach(([px,py,s])=>{
  ctx.beginPath();ctx.moveTo(px-hr*0.12,py+hr*0.15);
  ctx.quadraticCurveTo(px,py-hr*0.35*s,px+hr*0.18,py-hr*0.3*s);
  ctx.quadraticCurveTo(px+hr*0.1,py+hr*0.1,px+hr*0.14,py+hr*0.18);ctx.closePath();ctx.fill();});
 // кремовая морда
 const mz=ctx.createLinearGradient(0,-hr*0.1,0,hr*0.5);
 mz.addColorStop(0,'#ffe9c4');mz.addColorStop(1,'#e3b87e');
 ctx.fillStyle=mz;ellipse(-hr*0.9,hr*0.16,hr*0.7,hr*0.34);
 ctx.fillStyle='#f5ead0';
 for(let i=0;i<3;i++){const tx=-hr*(1.35-i*0.26);
  ctx.beginPath();ctx.moveTo(tx,hr*0.28);ctx.lineTo(tx+hr*0.05,hr*0.46);ctx.lineTo(tx+hr*0.11,hr*0.27);ctx.fill();}
 ctx.fillStyle='#6b3a1a';ctx.beginPath();ctx.ellipse(-hr*1.3,-hr*0.02,hr*0.07,hr*0.05,-0.3,0,7);ctx.fill();
 ctx.strokeStyle='rgba(255,240,220,.28)';ctx.lineWidth=hr*0.06;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-hr*1.45,-hr*0.12);ctx.quadraticCurveTo(-hr*0.7,-hr*0.72,hr*0.1,-hr*0.78);ctx.stroke();
 spec(-hr*0.9,-hr*0.15,hr*0.5,0.12);spec(-hr*0.1,-hr*0.45,hr*0.45,0.09);
 ctx.fillStyle='#d96a20';ctx.beginPath();ctx.moveTo(hr*0.15,hr*0.1);
 ctx.quadraticCurveTo(hr*0.75,hr*0.05,hr*0.95,hr*0.5);
 ctx.quadraticCurveTo(hr*0.45,hr*0.45,hr*0.1,hr*0.35);ctx.closePath();ctx.fill();
 drawEye(hr,w);
 const hgr=ctx.createLinearGradient(0,-hr,hr,-hr*1.5);
 hgr.addColorStop(0,'#93372e');hgr.addColorStop(1,'#5c1f1c');
 ctx.fillStyle=hgr;horn(hr,0,0,1);
 ctx.restore();}

let bodyGrad,spineGrad;
function drawDragon(){
 const g=LY,w=smooth(state.wake),wo=smooth(state.wing),j=state.jaw;
 const br=Math.sin(state.breath)*(0.03*(1-w)+0.018*w);
 const hx=lerp(g.bx-g.R*1.3,g.bx-g.R*1.6,w)+(Math.random()-0.5)*w*state.inten*8;
 const hy=lerp(g.by+g.R*0.4,g.by-g.R*0.9,w)+Math.sin(state.breath)*g.R*0.03;
 const tilt=lerp(0.24,-0.05,w)-j*0.2;
 const hr=g.hr;
 const mlx=-hr*1.45,mly=hr*0.28;
 mouth.x=hx+Math.cos(tilt)*mlx-Math.sin(tilt)*mly;
 mouth.y=hy+Math.sin(tilt)*mlx+Math.cos(tilt)*mly;
 mouth.ang=Math.PI+tilt*0.55;
 bodyGrad=ctx.createLinearGradient(0,g.by-g.R*1.3,0,g.by+g.R*1.05);
 bodyGrad.addColorStop(0,'#d96a1c');bodyGrad.addColorStop(.45,'#f5822e');
 bodyGrad.addColorStop(.8,'#ff9a4a');bodyGrad.addColorStop(1,'#ffb066');
 spineGrad=ctx.createLinearGradient(0,g.by-g.R*1.5,0,g.by);
 spineGrad.addColorStop(0,'#93372e');spineGrad.addColorStop(1,'#6b2724');
 const sg=ctx.createRadialGradient(g.bx,g.by+g.R*0.9,1,g.bx,g.by+g.R*0.9,g.R*1.7);
 sg.addColorStop(0,'rgba(40,20,5,.45)');sg.addColorStop(1,'rgba(40,20,5,0)');
 ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(g.bx,g.by+g.R*0.9,g.R*1.7,g.R*0.4,0,0,7);ctx.fill();
 drawWing(g,wo,true);
 drawTail(g,bodyGrad);
 ctx.save();
 ctx.translate(g.bx,g.by+g.R*0.7);ctx.scale(1,1+br);ctx.translate(-g.bx,-(g.by+g.R*0.7));
 ctx.fillStyle=bodyGrad;
 ellipse(g.bx,g.by,g.R,g.R*0.78);
 ellipse(g.bx+g.R*0.55,g.by+g.R*0.16,g.R*0.6,g.R*0.55);
 ellipse(g.bx-g.R*0.6,g.by-g.R*0.08,g.R*0.55,g.R*0.5);
 ellipse(g.bx-g.R*0.78,g.by+g.R*0.3,g.R*0.5,g.R*0.42);
 ctx.fillStyle='rgba(160,60,10,.3)';ellipse(g.bx+g.R*0.62,g.by+g.R*0.34,g.R*0.4,g.R*0.32);
 ctx.save();ctx.beginPath();ctx.ellipse(g.bx,g.by,g.R,g.R*0.78,0,0,7);ctx.clip();
 const bg2=ctx.createLinearGradient(0,g.by+g.R*0.05,0,g.by+g.R*0.85);
 bg2.addColorStop(0,'#f7ddb0');bg2.addColorStop(1,'#dfb27a');
 ctx.fillStyle=bg2;ctx.beginPath();ctx.ellipse(g.bx-g.R*0.25,g.by+g.R*0.5,g.R*0.8,g.R*0.42,0.1,0,7);ctx.fill();
 ctx.strokeStyle='rgba(180,120,60,.35)';ctx.lineWidth=g.R*0.02;
 for(let i=0;i<4;i++){ctx.beginPath();
  ctx.ellipse(g.bx-g.R*0.25,g.by+g.R*(0.18+i*0.2),g.R*0.78,g.R*0.4,0.1,0.35,2.6);ctx.stroke();}
 ctx.restore();
 ctx.fillStyle='rgba(190,80,20,.35)';
 for(const s of spots)ellipse(g.bx+Math.cos(s.a)*g.R*s.r,g.by+Math.sin(s.a)*g.R*0.6*s.r,s.s*g.R,s.s*g.R*0.8);
 drawSpines(g);drawLegs(g);
 ctx.globalCompositeOperation='lighter';
 const ug=ctx.createRadialGradient(g.bx,g.by+g.R*0.95,1,g.bx,g.by+g.R*0.95,g.R*1.3);
 ug.addColorStop(0,'rgba(255,190,80,.2)');ug.addColorStop(1,'rgba(255,190,80,0)');
 ctx.fillStyle=ug;ctx.beginPath();ctx.arc(g.bx,g.by+g.R*0.95,g.R*1.3,0,7);ctx.fill();
 ctx.globalCompositeOperation='source-over';
 ctx.strokeStyle='rgba(255,240,220,.18)';ctx.lineWidth=g.R*0.05;
 ctx.beginPath();ctx.ellipse(g.bx,g.by,g.R*0.97,g.R*0.76,-0.1,Math.PI*1.08,Math.PI*1.8);ctx.stroke();
 ctx.restore();
 drawWing(g,wo,false);
 drawNeck(g,bodyGrad,hx,hy,w);
 drawHead(g,hx,hy,tilt,hr,w,j);}

function drawFire(){
 const I=state.inten*100,g=LY;
 ctx.globalCompositeOperation='lighter';
 if(I>2){
  const mx=mouth.x,my=mouth.y,dx=Math.cos(mouth.ang),dy=Math.sin(mouth.ang);
  const len=g.R*(0.9+I*0.055);
  const fg=ctx.createRadialGradient(mx,my,1,mx,my,g.R*(0.4+I*0.004));
  fg.addColorStop(0,`rgba(255,220,140,${0.35+I*0.005})`);fg.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(mx,my,g.R*(0.4+I*0.004),0,7);ctx.fill();
  for(let i=0;i<=16;i++){const p=i/16;
   const wob=Math.sin(t*36+p*8.7)*g.R*0.06*(0.3+p)*(0.35+I/120)+p*p*g.R*0.1;
   const r=Math.max(0.5,g.R*(0.11+I*0.0022)*(1-p*0.78)*(0.72+0.32*Math.sin(t*47+p*13)));
   ctx.fillStyle=`hsla(${52-p*44},100%,${66-p*16}%,${(1-p)*0.85})`;
   ctx.beginPath();ctx.arc(mx+dx*p*len-dy*wob,my+dy*p*len+dx*wob,r,0,7);ctx.fill();
   if(p<0.3){ctx.fillStyle=`rgba(255,255,230,${(0.3-p)*2.2*Math.min(1,I/40)})`;
    ctx.beginPath();ctx.arc(mx+dx*p*len-dy*wob,my+dy*p*len+dx*wob,r*0.55,0,7);ctx.fill();}}
  const fl=ctx.createRadialGradient(mx,my,1,mx,my,g.R*1.1);
  fl.addColorStop(0,`rgba(255,150,40,${I/400})`);fl.addColorStop(1,'rgba(255,150,40,0)');
  ctx.fillStyle=fl;ctx.beginPath();ctx.arc(mx,my,g.R*1.1,0,7);ctx.fill();
  const gl=ctx.createRadialGradient(mx+dx*len*0.6,g.groundY,4,mx+dx*len*0.6,g.groundY,len*0.8);
  gl.addColorStop(0,`rgba(255,110,30,${I*0.003})`);gl.addColorStop(1,'rgba(255,110,30,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,g.groundY-80,W,120);}
 for(const p of parts){
  const q=p.l/p.tl;
  if(p.k===0){ctx.fillStyle=`hsla(${52-q*40},100%,${62-q*20}%,${(1-q)*0.9})`;
   ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1-q*0.6),0,7);ctx.fill();
  }else{ctx.globalCompositeOperation='source-over';
   ctx.fillStyle=`rgba(96,78,74,${(1-q)*0.2})`;
   ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
   ctx.globalCompositeOperation='lighter';}}
 ctx.globalCompositeOperation='source-over';}

function drawParticlesTop(){
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const z of zzz){const a=Math.min(1,z.age*3)*(1-z.age/2.8);
  ctx.save();ctx.translate(z.x,z.y);ctx.rotate(Math.sin(t*1.5+z.p)*0.15);
  ctx.font=`700 ${z.s*(1+z.age*0.3)}px Unbounded`;
  ctx.fillStyle=`rgba(220,235,245,${a*0.9})`;
  ctx.shadowColor='rgba(160,200,255,.6)';ctx.shadowBlur=8;
  ctx.fillText('Z',0,0);ctx.restore();}
 ctx.globalCompositeOperation='lighter';
 for(const s of sparkles){const q=s.age/s.tl,a=Math.sin(q*Math.PI);
  ctx.fillStyle=`rgba(255,235,170,${a})`;
  ctx.save();ctx.translate(s.x,s.y);
  ctx.beginPath();ctx.moveTo(0,-s.s);ctx.lineTo(s.s*0.22,0);ctx.lineTo(0,s.s);ctx.lineTo(-s.s*0.22,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-s.s,0);ctx.lineTo(0,s.s*0.22);ctx.lineTo(s.s,0);ctx.lineTo(0,-s.s*0.22);ctx.closePath();ctx.fill();
  ctx.restore();}
 for(const f of flyCoins){const k=clamp(f.age/0.75),e=k*k;
  const r=coinChip.getBoundingClientRect();
  const x=lerp(f.x,r.left+r.width/2,e),y=lerp(f.y,r.top+r.height/2,e)-Math.sin(k*Math.PI)*90;
  ctx.save();ctx.translate(x,y);ctx.rotate(k*7);
  const s2=lerp(1,0.4,k)*(20/60);ctx.scale(s2,s2);ctx.drawImage(coinSpr,-30,-30);ctx.restore();}
 ctx.globalCompositeOperation='source-over';}

function render(){
 const I=state.inten*100,light=0.35+state.inten*0.6;
 const amp=shake*10+(I>70&&state.wake>0.5?(I-70)/30*3:0);
 ctx.save();
 if(amp>0.1)ctx.translate((Math.random()-0.5)*amp,(Math.random()-0.5)*amp);
 drawRocks(light);
 drawMound();
 for(const cn of coins)if(cn.y<=LY.by+LY.R*0.55)drawCoin(cn);
 drawGems();drawCrown();
 drawDragon();
 for(const cn of coins)if(cn.y>LY.by+LY.R*0.55)drawCoin(cn);
 drawFire();
 drawParticlesTop();
 ctx.restore();
 const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.5,H*0.95);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,2,1,.5)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}

function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
 update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
